# Records the authenticated requester of every EvidenceSigningRequest
# (add-evidence-signing-recovery 1.2). The mutation overwrites any
# user-supplied spec.requestedBy; the validation fails closed if the stored
# value does not match the API server's user info, including when the
# mutation did not run. The spec is immutable after creation (CRD rule), so
# the requester cannot be rewritten later. Only holders of
# konstapel-evidence-signing-recoverer can create requests (RBAC).
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: konstapel-evidence-signing-requester
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [compliance.erenius.io]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [evidencesigningrequests]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{requestedBy: Object.spec.requestedBy{
            username: request.userInfo.username,
            ?uid: request.userInfo.?uid
          }}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: konstapel-evidence-signing-requester
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  policyName: konstapel-evidence-signing-requester
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: konstapel-evidence-signing-requester
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [compliance.erenius.io]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [evidencesigningrequests]
  validations:
    - expression: >-
        has(object.spec.requestedBy) &&
        object.spec.requestedBy.username == request.userInfo.username &&
        object.spec.requestedBy.?uid.orValue('') == request.userInfo.?uid.orValue('')
      message: spec.requestedBy must be the authenticated requester
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: konstapel-evidence-signing-requester
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  policyName: konstapel-evidence-signing-requester
  validationActions: [Deny]
