# Records the authenticated registrant of every EvidenceAttachment
# (add-supporting-evidence-attachments 1.2). The mutation replaces any
# user-supplied spec.registeredBy as a whole, including a uid the registrant
# does not have; the validation fails closed if the stored value does not
# match the API server's user info. The spec is immutable
# after creation (CRD rule), so the registrant cannot be rewritten later.
# The declared document source (spec.source) is a separate, unauthenticated
# claim. The uploader is recorded by the transfer service, not here.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: konstapel-evidence-attachment-registrant
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [compliance.erenius.io]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [evidenceattachments]
  mutations:
    # A JSON Patch replaces the field as a whole: an apply configuration
    # would merge into the submitted value and keep a forged uid when the
    # user has none (for example an X.509 client certificate).
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{op: "add", path: "/spec/registeredBy", value: Object.spec.registeredBy{
            username: request.userInfo.username,
            ?uid: request.userInfo.?uid
          }}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: konstapel-evidence-attachment-registrant
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  policyName: konstapel-evidence-attachment-registrant
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: konstapel-evidence-attachment-registrant
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [compliance.erenius.io]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [evidenceattachments]
  validations:
    - expression: >-
        has(object.spec.registeredBy) &&
        object.spec.registeredBy.username == request.userInfo.username &&
        object.spec.registeredBy.?uid.orValue('') == request.userInfo.?uid.orValue('')
      message: spec.registeredBy must be the authenticated registrant
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: konstapel-evidence-attachment-registrant
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  policyName: konstapel-evidence-attachment-registrant
  validationActions: [Deny]
