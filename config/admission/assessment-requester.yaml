# Records the authenticated creator of every AssessmentRequest. The mutation
# replaces any user-supplied requester as a whole, including a uid the
# creator does not have; the validation fails closed if the stored requester
# does not match the API server's user info.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: konstapel-assessment-requester
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [compliance.erenius.io]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [assessmentrequests]
  mutations:
    # A JSON Patch replaces the field as a whole: an apply configuration
    # would merge into the submitted value and keep a forged uid when the
    # user has none (for example an X.509 client certificate).
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{op: "add", path: "/spec/requester", value: Object.spec.requester{
            username: request.userInfo.username,
            ?uid: request.userInfo.?uid
          }}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: konstapel-assessment-requester
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  policyName: konstapel-assessment-requester
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: konstapel-assessment-requester
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [compliance.erenius.io]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [assessmentrequests]
  validations:
    - expression: >-
        has(object.spec.requester) &&
        object.spec.requester.username == request.userInfo.username &&
        object.spec.requester.?uid.orValue('') == request.userInfo.?uid.orValue('')
      message: spec.requester must be the authenticated creator
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: konstapel-assessment-requester
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  policyName: konstapel-assessment-requester
  validationActions: [Deny]
