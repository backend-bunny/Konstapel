# Maintains spec.enforcementEpoch on every ComplianceBinding write, so that
# reporting-only edits (spec.assessment) keep engine policy identities and
# accepted exceptions, while any enforcement change, including a rollback to
# earlier values, gets a new epoch and therefore new revisions.
#
#   CREATE                                  -> 1
#   UPDATE, old has epoch, no enforcement change   -> old epoch (carried forward
#                                                     even if the request omits it)
#   UPDATE, old has epoch, enforcement change      -> old epoch + 1
#   UPDATE, old has no epoch (created before this policy):
#       no enforcement change -> old metadata.generation (the epoch its
#                                current revisions were computed with)
#       enforcement change    -> old metadata.generation + 1
#
# Enforcement fields are spec.profileRef, spec.namespaceSelector and spec.mode.
# Any user-supplied epoch is overwritten. The CRD's transition rule rejects an
# epoch that disappears or does not follow these rules, so a cluster without
# this policy fails closed on updates of bindings that already have an epoch.
# Requires MutatingAdmissionPolicy (admissionregistration.k8s.io/v1,
# Kubernetes 1.36 or later).
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: konstapel-binding-enforcement-epoch
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [compliance.erenius.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [compliancebindings]
  variables:
    - name: enforcementChanged
      expression: >-
        request.operation == 'UPDATE' && (
          object.spec.profileRef != oldObject.spec.profileRef ||
          object.spec.?namespaceSelector != oldObject.spec.?namespaceSelector ||
          object.spec.mode != oldObject.spec.mode)
    - name: base
      expression: >-
        request.operation == 'CREATE' ? 0 :
        (has(oldObject.spec.enforcementEpoch) ? oldObject.spec.enforcementEpoch : oldObject.metadata.generation)
    - name: epoch
      expression: >-
        request.operation == 'CREATE' ? 1 :
        (variables.enforcementChanged ? variables.base + 1 : variables.base)
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{enforcementEpoch: variables.epoch}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: konstapel-binding-enforcement-epoch
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  policyName: konstapel-binding-enforcement-epoch
