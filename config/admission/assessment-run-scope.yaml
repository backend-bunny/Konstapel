# Only the controller may create Namespace-scope runs or set Scheduled/Request
# triggers. Platform operators may create Binding-scope Manual runs.
# Adjust the controller identity if the controller is not deployed as
# konstapel-system/konstapel-controller.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: konstapel-assessment-run-scope
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [compliance.erenius.io]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [assessmentruns]
  variables:
    - name: controller
      expression: request.userInfo.username == 'system:serviceaccount:konstapel-system:konstapel-controller'
  validations:
    - expression: >-
        variables.controller ||
        (object.spec.scope == 'Binding' &&
         (!has(object.spec.trigger) || object.spec.trigger.type == 'Manual'))
      message: only the Konstapel controller may create Namespace-scope runs or Scheduled/Request triggers
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: konstapel-assessment-run-scope
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  policyName: konstapel-assessment-run-scope
  validationActions: [Deny]
