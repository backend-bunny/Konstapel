---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: evidencedestinations.compliance.erenius.io
spec:
  group: compliance.erenius.io
  names:
    kind: EvidenceDestination
    listKind: EvidenceDestinationList
    plural: evidencedestinations
    shortNames:
    - evdest
    singular: evidencedestination
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.s3.bucket
      name: Bucket
      type: string
    - jsonPath: .spec.s3.prefix
      name: Prefix
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.deletionPolicy
      name: Deletion
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EvidenceDestination is a cluster-scoped, platform-managed evidence storage
          location. Runs pin it by name and UID when they start; later edits to the
          default or a binding's selection affect only subsequent runs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EvidenceDestinationSpec is platform-managed storage for evidence
              packages.
            properties:
              deletionPolicy:
                default: Retire
                description: |-
                  deletionPolicy is what deleting this destination does. Retire (the
                  default) keeps it until its outstanding obligations finish; Orphan is
                  the explicit, audited handoff. Setting it alone deletes nothing.
                enum:
                - Retire
                - Orphan
                type: string
              s3:
                description: s3 is the S3-compatible location and its access.
                properties:
                  addressing:
                    default: path
                    description: addressing selects path-style or virtual-hosted requests.
                    enum:
                    - path
                    - virtual
                    type: string
                  bucket:
                    description: |-
                      bucket must already exist; Konstapel never creates or reconfigures it.
                      Immutable.
                    maxLength: 63
                    minLength: 3
                    pattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$
                    type: string
                  caTrust:
                    description: |-
                      caTrust names extra trusted PEM roots in the controller namespace.
                      TLS verification is never disabled. Rotatable.
                    properties:
                      key:
                        default: ca.crt
                        description: key is the ConfigMap data key holding PEM certificates.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: name of the object in the controller namespace.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                        type: string
                      namespace:
                        description: |-
                          namespace is rejected when set; it exists so that a cross-namespace
                          reference is an explicit API error rather than a silently dropped field.
                        type: string
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: references resolve in the controller namespace only;
                        namespace must not be set
                      rule: '!has(self.__namespace__)'
                  credentialSecret:
                    description: |-
                      credentialSecret names the credential Secret in the controller
                      namespace. Rotatable, including while the destination is retiring.
                    properties:
                      accessKeyIDKey:
                        default: accessKeyID
                        description: accessKeyIDKey is the Secret data key of the
                          access key ID.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: name of the object in the controller namespace.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                        type: string
                      namespace:
                        description: |-
                          namespace is rejected when set; it exists so that a cross-namespace
                          reference is an explicit API error rather than a silently dropped field.
                        type: string
                      secretAccessKeyKey:
                        default: secretAccessKey
                        description: secretAccessKeyKey is the Secret data key of
                          the secret access key.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: references resolve in the controller namespace only;
                        namespace must not be set
                      rule: '!has(self.__namespace__)'
                  developmentFixture:
                    description: |-
                      developmentFixture permits a plain-http endpoint for an explicitly
                      isolated local test service.
                    type: boolean
                  endpoint:
                    description: endpoint is the S3 service URL. Immutable.
                    maxLength: 2048
                    minLength: 8
                    pattern: ^https?://[^\s/?#@]+(:[0-9]+)?/?$
                    type: string
                  prefix:
                    description: |-
                      prefix is a clean relative key prefix; Konstapel writes only below it.
                      Immutable.
                    maxLength: 512
                    pattern: ^[A-Za-z0-9!_.*'()-]+(/[A-Za-z0-9!_.*'()-]+)*$
                    type: string
                    x-kubernetes-validations:
                    - message: prefix must not contain . or .. segments
                      rule: '!self.matches(''(^|/)[.]{1,2}(/|$)'')'
                  region:
                    description: region of the bucket. Immutable.
                    maxLength: 64
                    minLength: 1
                    pattern: ^[a-z0-9-]+$
                    type: string
                  workloadIdentity:
                    description: workloadIdentity uses the SDK's standard credential
                      chain.
                    type: boolean
                required:
                - bucket
                - endpoint
                - region
                type: object
                x-kubernetes-validations:
                - message: endpoint, bucket, region, and prefix are immutable; create
                    a new EvidenceDestination for a new location
                  rule: self.endpoint == oldSelf.endpoint && self.bucket == oldSelf.bucket
                    && self.region == oldSelf.region && has(self.prefix) == has(oldSelf.prefix)
                    && (!has(self.prefix) || self.prefix == oldSelf.prefix)
                - message: 'set exactly one credential source: workloadIdentity or
                    credentialSecret'
                  rule: (has(self.workloadIdentity) && self.workloadIdentity) != has(self.credentialSecret)
                - message: endpoint must be https; plain http is allowed only for
                    an isolated developmentFixture
                  rule: self.endpoint.startsWith('https://') || (has(self.developmentFixture)
                    && self.developmentFixture && self.endpoint.startsWith('http://'))
            required:
            - s3
            type: object
          status:
            description: EvidenceDestinationStatus is written by the controller only.
            properties:
              cleanupBlockers:
                description: cleanupBlockers are bounded descriptions of what blocks
                  retirement.
                items:
                  maxLength: 512
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: conditions report readiness and retirement.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              latestRetainedExpiry:
                description: latestRetainedExpiry is the latest known expiry of a
                  retained package.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  describes.
                format: int64
                type: integer
              outstandingPackages:
                description: outstandingPackages counts retained packages not yet
                  deleted.
                format: int32
                minimum: 0
                type: integer
              outstandingRuns:
                description: |-
                  outstandingRuns counts accepted runs pinned to this destination that
                  have not finished publication.
                format: int32
                minimum: 0
                type: integer
              unknownExpiryRuns:
                description: |-
                  unknownExpiryRuns counts outstanding runs whose expiry is not yet
                  known because they have not committed. It is not zero outstanding work.
                format: int32
                minimum: 0
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
