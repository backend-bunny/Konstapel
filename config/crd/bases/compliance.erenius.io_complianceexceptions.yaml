---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: complianceexceptions.compliance.erenius.io
spec:
  group: compliance.erenius.io
  names:
    kind: ComplianceException
    listKind: ComplianceExceptionList
    plural: complianceexceptions
    shortNames:
    - cexc
    singular: complianceexception
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.policy
      name: Policy
      type: string
    - jsonPath: .spec.acceptanceRevision
      name: Revision
      type: integer
    - jsonPath: .spec.expiresAt
      name: Expires
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ComplianceException is a namespace team's self-service, time-limited
          exception from one eligible logical policy for selected workloads in its
          namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ComplianceExceptionSpec is an application team's time-limited acceptance of
              risk for one logical policy and a workload scope in its own namespace.

              The policy and workload selector are fixed at creation; wider scope needs a
              new resource. Creation is acceptance revision 1. An explicit renewal
              increments acceptanceRevision by one and may change only the reason and
              expiry with it; any other change to the reason or expiry is rejected, so
              metadata edits and reconciliation cannot renew. Admission (identity, time,
              eligibility and lifetime checks) and the controller do the rest.
            properties:
              acceptanceRevision:
                description: |-
                  acceptanceRevision counts explicit acceptances: 1 at creation, plus one
                  for each renewal.
                format: int64
                minimum: 1
                type: integer
              expiresAt:
                description: |-
                  expiresAt ends the acceptance. It must be in the future and within the
                  shortest applicable maxLifetime, checked at admission.
                format: date-time
                type: string
              policy:
                description: |-
                  policy is the logical policy identity within the bundle, as used by
                  ComplianceProfile spec.policies[].name. Immutable.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: policy is immutable; create a new ComplianceException
                  rule: self == oldSelf
              reason:
                description: reason explains the accepted risk. It must not be blank.
                maxLength: 1024
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: reason must not be blank
                  rule: self.trim().size() > 0
              workloadSelector:
                description: |-
                  workloadSelector selects the evaluated objects, in this namespace only,
                  by their own labels. It is required; an explicit {} selects every
                  applicable workload in the namespace. Controllers and their Pods are
                  distinct objects: label both when both need the exception. Immutable.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: workloadSelector is immutable; create a new ComplianceException
                  rule: self == oldSelf
            required:
            - acceptanceRevision
            - expiresAt
            - policy
            - reason
            - workloadSelector
            type: object
            x-kubernetes-validations:
            - message: a new exception starts at acceptanceRevision 1
              optionalOldSelf: true
              rule: oldSelf.hasValue() || self.acceptanceRevision == 1
            - message: a renewal increments acceptanceRevision by exactly one
              optionalOldSelf: true
              rule: '!oldSelf.hasValue() || self.acceptanceRevision == oldSelf.value().acceptanceRevision
                || self.acceptanceRevision == oldSelf.value().acceptanceRevision +
                1'
            - message: reason and expiresAt change only with an explicit renewal (acceptanceRevision
                + 1)
              optionalOldSelf: true
              rule: '!oldSelf.hasValue() || self.acceptanceRevision != oldSelf.value().acceptanceRevision
                || (self.reason == oldSelf.value().reason && self.expiresAt == oldSelf.value().expiresAt)'
          status:
            description: ComplianceExceptionStatus is written only by the Konstapel
              controller.
            properties:
              acceptance:
                description: |-
                  acceptance references the immutable snapshot of the current acceptance
                  revision. Earlier revisions keep their own snapshots.
                properties:
                  digest:
                    description: digest is the sha256 of the snapshot document.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  revision:
                    description: revision is the acceptance revision the snapshot
                      records.
                    format: int64
                    minimum: 1
                    type: integer
                  snapshot:
                    description: |-
                      snapshot is the "<namespace>/<name>" of the immutable ConfigMap that
                      holds the snapshot in the protected Konstapel namespace.
                    maxLength: 317
                    type: string
                required:
                - digest
                - revision
                - snapshot
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
