---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: evidencesigningrequests.compliance.erenius.io
spec:
  group: compliance.erenius.io
  names:
    kind: EvidenceSigningRequest
    listKind: EvidenceSigningRequestList
    plural: evidencesigningrequests
    shortNames:
    - esreq
    singular: evidencesigningrequest
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.run.name
      name: Run
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .spec.requestedBy.username
      name: Requested By
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EvidenceSigningRequest is an administrator's attributed request to finish
          the signed publication of one retained SigningFailed AssessmentRun with its
          existing archive and original signing intent. It never recollects
          evidence, changes outcomes, extends expiry, or substitutes a key.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EvidenceSigningRequestSpec is immutable: a corrected request is a new
              EvidenceSigningRequest.
            properties:
              expectedKeyFingerprint:
                description: |-
                  expectedKeyFingerprint ("sha256:" and 64 lowercase hex digits)
                  confirms the key in the intent's recorded Secret when the intent never
                  pinned one. It authorizes initial key selection; it does not prove a
                  previously established key identity. A pinned intent ignores it: only
                  the pinned key is ever used.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              reason:
                description: reason is free text for the audit trail. It must not
                  be blank.
                maxLength: 1024
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: reason must not be blank
                  rule: self.trim().size() > 0
              requestedBy:
                description: |-
                  requestedBy is the authenticated identity that created the request.
                  The konstapel-evidence-signing-requester admission policies set it
                  from the API server's user info on create; user-supplied values are
                  overwritten and mismatches are rejected.
                properties:
                  uid:
                    maxLength: 128
                    type: string
                  username:
                    maxLength: 512
                    minLength: 1
                    type: string
                required:
                - username
                type: object
              run:
                description: |-
                  run is the retained SigningFailed AssessmentRun to recover, by name and
                  UID. Admission does not look it up; the controller reports RunNotFound.
                properties:
                  name:
                    description: name is the AssessmentRun's name (a DNS subdomain).
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                  uid:
                    description: uid is the run's metadata.uid.
                    maxLength: 36
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                required:
                - name
                - uid
                type: object
            required:
            - reason
            - run
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; create a new EvidenceSigningRequest
              rule: self == oldSelf
          status:
            description: |-
              EvidenceSigningRequestStatus is written only by the Konstapel controller
              (RBAC and the konstapel-evidence-signing-status-writer admission policy).
              It never holds key bytes, Secret names, or Secret contents. Once the phase
              is terminal the status never changes; the recorded requester and run are
              set once.
            properties:
              acceptedAt:
                description: acceptedAt, startedAt and completedAt are controller
                  times.
                format: date-time
                type: string
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              keyFingerprint:
                description: |-
                  keyFingerprint is the intent key used or confirmed, never the Secret
                  name.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              message:
                description: message explains the reason. It never holds key or Secret
                  bytes.
                maxLength: 1024
                type: string
              phase:
                description: |-
                  SigningRequestPhase is an EvidenceSigningRequest's lifecycle. Succeeded and
                  Failed are terminal: a terminal request is never re-evaluated and its
                  status never changes again.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              publication:
                description: |-
                  publication is the committed or adopted signed publication (Succeeded
                  only).
                properties:
                  expiresAt:
                    format: date-time
                    type: string
                  packageSha256:
                    description: |-
                      packageSha256 and signatureSha256 are the lowercase hex digests of the
                      committed archive and its signature bundle.
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  publicationID:
                    maxLength: 64
                    minLength: 1
                    type: string
                  publishedAt:
                    description: |-
                      publishedAt is the storage commit time; expiresAt the commit's fixed
                      expiry.
                    format: date-time
                    type: string
                  signatureSha256:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                required:
                - expiresAt
                - packageSha256
                - publicationID
                - publishedAt
                - signatureSha256
                type: object
              reason:
                description: reason is the phase's fixed reason (see SigningRecoveryReasons).
                enum:
                - Accepted
                - Waiting
                - Signing
                - Committing
                - Recovered
                - AlreadyRecovered
                - RunNotFound
                - RunDeleting
                - NotRecoverable
                - Expired
                - Orphaned
                - EvidenceLost
                - KeyConfirmationRequired
                - KeyMismatch
                - SigningFailed
                - Conflict
                type: string
              requestedBy:
                description: requestedBy is spec.requestedBy, copied at acceptance.
                properties:
                  uid:
                    maxLength: 128
                    type: string
                  username:
                    maxLength: 512
                    minLength: 1
                    type: string
                required:
                - username
                type: object
              run:
                description: run is spec.run as observed at acceptance.
                properties:
                  name:
                    description: name is the AssessmentRun's name (a DNS subdomain).
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                  uid:
                    description: uid is the run's metadata.uid.
                    maxLength: 36
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                required:
                - name
                - uid
                type: object
              startedAt:
                format: date-time
                type: string
            type: object
            x-kubernetes-validations:
            - message: phase and reason are set together
              rule: has(self.phase) == has(self.reason)
            - message: reason is not in the phase's vocabulary
              rule: '!has(self.phase) || !has(self.reason) || (self.phase == ''Pending''
                && self.reason in [''Accepted'', ''Waiting'']) || (self.phase == ''Running''
                && self.reason in [''Signing'', ''Committing'']) || (self.phase ==
                ''Succeeded'' && self.reason in [''Recovered'', ''AlreadyRecovered''])
                || (self.phase == ''Failed'' && self.reason in [''RunNotFound'', ''RunDeleting'',
                ''NotRecoverable'', ''Expired'', ''Orphaned'', ''EvidenceLost'', ''KeyConfirmationRequired'',
                ''KeyMismatch'', ''SigningFailed'', ''Conflict''])'
            - message: a terminal phase records completedAt
              rule: '!has(self.phase) || !(self.phase in [''Succeeded'', ''Failed''])
                || has(self.completedAt)'
            - message: a successful request records its publication and key fingerprint
              rule: '!has(self.phase) || self.phase != ''Succeeded'' || (has(self.publication)
                && has(self.keyFingerprint))'
            - message: the Complete condition is True exactly on a terminal phase
              rule: (has(self.phase) && self.phase in ['Succeeded', 'Failed']) ==
                (has(self.conditions) && self.conditions.exists(c, c.type == 'Complete'
                && c.status == 'True'))
            - message: a terminal outcome is never rewritten
              rule: '!has(oldSelf.phase) || !(oldSelf.phase in [''Succeeded'', ''Failed''])
                || self == oldSelf'
            - message: the recorded requester is set once
              rule: '!has(oldSelf.requestedBy) || (has(self.requestedBy) && self.requestedBy
                == oldSelf.requestedBy)'
            - message: the recorded run is set once
              rule: '!has(oldSelf.run) || (has(self.run) && self.run == oldSelf.run)'
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: status.run must be spec.run
          rule: '!has(self.status) || !has(self.status.run) || (self.status.run.name
            == self.spec.run.name && self.status.run.uid == self.spec.run.uid)'
        - message: status.requestedBy must be spec.requestedBy
          rule: '!has(self.status) || !has(self.status.requestedBy) || (has(self.spec.requestedBy)
            && self.status.requestedBy.username == self.spec.requestedBy.username
            && (has(self.status.requestedBy.uid) && self.status.requestedBy.uid.size()
            > 0) == (has(self.spec.requestedBy.uid) && self.spec.requestedBy.uid.size()
            > 0) && (!has(self.status.requestedBy.uid) || self.status.requestedBy.uid.size()
            == 0 || self.status.requestedBy.uid == self.spec.requestedBy.uid))'
        - message: a recorded request status is never removed
          rule: '!has(oldSelf.status) || ((!has(oldSelf.status.phase) || !(oldSelf.status.phase
            in [''Succeeded'', ''Failed''])) && !has(oldSelf.status.requestedBy) &&
            !has(oldSelf.status.run)) || has(self.status)'
    served: true
    storage: true
    subresources:
      status: {}
