---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: compliancebindings.compliance.erenius.io
spec:
  group: compliance.erenius.io
  names:
    kind: ComplianceBinding
    listKind: ComplianceBindingList
    plural: compliancebindings
    shortNames:
    - cbinding
    singular: compliancebinding
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.profileRef.name
      name: Profile
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.targetCount
      name: Targets
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Resolved")].status
      name: Resolved
      type: string
    - jsonPath: .status.conditions[?(@.type=="EngineReady")].status
      name: EngineReady
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ComplianceBinding applies a ComplianceProfile to namespaces in
          Audit or Deny mode.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ComplianceBindingSpec applies a profile to selected namespaces
              in one mode.
            properties:
              assessment:
                default: {}
                description: |-
                  assessment configures continuous assessment. Omitted settings default;
                  changing them is a reporting-only edit.
                properties:
                  collectionTimeout:
                    default: 5m
                    description: collectionTimeout bounds how long a run waits for
                      evidence.
                    maxLength: 32
                    minLength: 2
                    type: string
                    x-kubernetes-validations:
                    - message: must be a duration such as 24h, 90m or 2160h; days,
                        cron expressions and signs are not supported
                      rule: self.matches('^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h))+$')
                    - message: must be a positive duration
                      rule: '!self.matches(''^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h))+$'')
                        || duration(self) > duration(''0s'')'
                  destinationRef:
                    description: |-
                      destinationRef overrides the central default evidence destination for
                      this binding by name and UID. Requests inherit it. An unusable
                      selection fails visibly and never falls back to the default.
                    properties:
                      name:
                        description: name of the EvidenceDestination.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                        type: string
                      uid:
                        description: uid of the EvidenceDestination.
                        maxLength: 64
                        minLength: 1
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                  interval:
                    default: 24h
                    description: interval between scheduled snapshots, measured from
                      a persisted anchor.
                    maxLength: 32
                    minLength: 2
                    type: string
                    x-kubernetes-validations:
                    - message: must be a duration such as 24h, 90m or 2160h; days,
                        cron expressions and signs are not supported
                      rule: self.matches('^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h))+$')
                    - message: must be a positive duration
                      rule: '!self.matches(''^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h))+$'')
                        || duration(self) > duration(''0s'')'
                  maxEvidenceAge:
                    default: 2h
                    description: |-
                      maxEvidenceAge is the oldest source evaluation accepted as current
                      evidence at snapshot closure.
                    maxLength: 32
                    minLength: 2
                    type: string
                    x-kubernetes-validations:
                    - message: must be a duration such as 24h, 90m or 2160h; days,
                        cron expressions and signs are not supported
                      rule: self.matches('^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h))+$')
                    - message: must be a positive duration
                      rule: '!self.matches(''^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h))+$'')
                        || duration(self) > duration(''0s'')'
                  retention:
                    default: 2160h
                    description: |-
                      retention is how long published packages are kept, fixed at
                      publication. 90 days is 2160h.
                    maxLength: 32
                    minLength: 2
                    type: string
                    x-kubernetes-validations:
                    - message: must be a duration such as 24h, 90m or 2160h; days,
                        cron expressions and signs are not supported
                      rule: self.matches('^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h))+$')
                    - message: must be a positive duration
                      rule: '!self.matches(''^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h))+$'')
                        || duration(self) > duration(''0s'')'
                type: object
              enforcementEpoch:
                description: |-
                  enforcementEpoch identifies the enforcement configuration. The
                  konstapel-binding-enforcement-epoch admission policy maintains it; user
                  values are overwritten. It changes only when profileRef,
                  namespaceSelector or mode change, so reporting-only edits keep engine
                  policy identities and accepted exceptions.
                format: int64
                minimum: 1
                type: integer
              mode:
                description: mode is Audit or Deny. It has no default.
                enum:
                - Audit
                - Deny
                type: string
              namespaceSelector:
                description: |-
                  namespaceSelector selects Namespaces by their labels with standard
                  Kubernetes LabelSelector semantics. It is required; an explicit empty
                  selector ({}) selects every namespace.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements;
                      requirements are ANDed.
                    items:
                      description: NamespaceSelectorRequirement is a bounded metav1.LabelSelectorRequirement.
                      properties:
                        key:
                          description: key is the label key the selector applies to.
                          maxLength: 317
                          type: string
                          x-kubernetes-validations:
                          - message: must be a valid label key (qualified name)
                            rule: '!format.qualifiedName().validate(self).hasValue()'
                        operator:
                          description: operator is In, NotIn, Exists, or DoesNotExist.
                          enum:
                          - In
                          - NotIn
                          - Exists
                          - DoesNotExist
                          type: string
                        values:
                          description: values for In and NotIn; must be empty for
                            Exists and DoesNotExist.
                          items:
                            maxLength: 63
                            type: string
                          maxItems: 64
                          type: array
                          x-kubernetes-list-type: atomic
                          x-kubernetes-validations:
                          - message: values must be valid label values
                            rule: self.all(v, !format.labelValue().validate(v).hasValue())
                      required:
                      - key
                      - operator
                      type: object
                      x-kubernetes-validations:
                      - message: In and NotIn require values; Exists and DoesNotExist
                          must not set values
                        rule: 'self.operator in [''In'', ''NotIn''] ? (has(self.values)
                          && size(self.values) > 0) : (!has(self.values) || size(self.values)
                          == 0)'
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      description: LabelValue is a Kubernetes label value.
                      maxLength: 63
                      type: string
                    description: matchLabels requires each {key,value} pair; requirements
                      are ANDed.
                    maxProperties: 64
                    type: object
                    x-kubernetes-validations:
                    - message: keys must be valid label keys (qualified names)
                      rule: self.all(k, !format.qualifiedName().validate(k).hasValue())
                    - message: values must be valid label values
                      rule: self.all(k, !format.labelValue().validate(self[k]).hasValue())
                type: object
                x-kubernetes-map-type: atomic
              profileRef:
                description: profileRef references the profile whose policies this
                  binding contributes.
                properties:
                  name:
                    description: name of the ComplianceProfile.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - mode
            - namespaceSelector
            - profileRef
            type: object
            x-kubernetes-validations:
            - message: 'enforcementEpoch is maintained by admission: unchanged for
                reporting-only edits and incremented by one when profileRef, namespaceSelector
                or mode change'
              rule: '!has(oldSelf.enforcementEpoch) || (has(self.enforcementEpoch)
                && ((self.profileRef == oldSelf.profileRef && self.namespaceSelector
                == oldSelf.namespaceSelector && self.mode == oldSelf.mode) ? self.enforcementEpoch
                == oldSelf.enforcementEpoch : self.enforcementEpoch == oldSelf.enforcementEpoch
                + 1))'
          status:
            description: |-
              ComplianceBindingStatus reports resolution and engine readiness separately.
              It does not report assessment outcomes.
            properties:
              assessment:
                description: |-
                  assessment is owned by the assessment controller; see
                  BindingAssessmentStatus. The targeting controller carries it forward.
                properties:
                  current:
                    description: |-
                      current is the continuously reconciled evidence state. It is separate
                      from historical snapshots and from EngineReady, which never asserts
                      compliance.
                    properties:
                      evaluatedAt:
                        description: evaluatedAt is when the controller last evaluated
                          current evidence.
                        format: date-time
                        type: string
                      evidence:
                        description: EvidenceSummary counts expected checks by evidence
                          state.
                        properties:
                          attributable:
                            format: int32
                            minimum: 0
                            type: integer
                          completeness:
                            description: EvidenceCompleteness describes evidence coverage
                              only, never outcomes.
                            enum:
                            - Complete
                            - Incomplete
                            - NoTargets
                            type: string
                          expected:
                            format: int32
                            minimum: 0
                            type: integer
                          missing:
                            format: int32
                            minimum: 0
                            type: integer
                          rejected:
                            format: int32
                            minimum: 0
                            type: integer
                          staleScopes:
                            description: |-
                              staleScopes counts bindings or policies whose configuration did not
                              resolve; any stale scope makes evidence Incomplete.
                            format: int32
                            minimum: 0
                            type: integer
                          unresolved:
                            format: int32
                            minimum: 0
                            type: integer
                        required:
                        - attributable
                        - completeness
                        - expected
                        - missing
                        - rejected
                        - unresolved
                        type: object
                      limitations:
                        description: limitations explain why evidence is incomplete,
                          most significant first.
                        items:
                          maxLength: 256
                          type: string
                        maxItems: 8
                        type: array
                        x-kubernetes-list-type: atomic
                      nextExpiry:
                        description: nextExpiry is when the oldest attributable evidence
                          becomes stale.
                        format: date-time
                        type: string
                      outcomes:
                        description: |-
                          OutcomeCounts preserves check dispositions separately from completeness.
                          It deliberately has no aggregate pass field.
                        properties:
                          acceptedRisk:
                            format: int32
                            minimum: 0
                            type: integer
                          error:
                            format: int32
                            minimum: 0
                            type: integer
                          fail:
                            format: int32
                            minimum: 0
                            type: integer
                          notApplicable:
                            format: int32
                            minimum: 0
                            type: integer
                          pass:
                            format: int32
                            minimum: 0
                            type: integer
                          skip:
                            format: int32
                            minimum: 0
                            type: integer
                          unknown:
                            format: int32
                            minimum: 0
                            type: integer
                        required:
                        - acceptedRisk
                        - error
                        - fail
                        - notApplicable
                        - pass
                        - skip
                        - unknown
                        type: object
                    required:
                    - evaluatedAt
                    - evidence
                    - outcomes
                    type: object
                  destination:
                    description: destination is the resolved evidence destination
                      selection.
                    properties:
                      message:
                        description: message explains the reason.
                        maxLength: 1024
                        type: string
                      ready:
                        description: |-
                          ready is true only when the referenced destination exists with the
                          same UID, is not retiring, and its backend is Ready.
                        type: boolean
                      reason:
                        description: |-
                          reason is Selected or why the selection cannot be used. There is never
                          a fallback to another destination.
                        maxLength: 64
                        type: string
                      ref:
                        description: ref is the selected destination.
                        properties:
                          name:
                            description: name of the EvidenceDestination.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                            type: string
                          uid:
                            description: uid of the EvidenceDestination.
                            maxLength: 64
                            minLength: 1
                            type: string
                        required:
                        - name
                        - uid
                        type: object
                      source:
                        description: |-
                          source is Binding (spec.assessment.destinationRef), Default (the central
                          default), or None (no selection configured).
                        enum:
                        - Binding
                        - Default
                        - None
                        - Migrated
                        type: string
                    required:
                    - ready
                    - reason
                    - source
                    type: object
                  latestRun:
                    description: latestRun is the newest run started for this binding.
                    properties:
                      name:
                        maxLength: 253
                        type: string
                      uid:
                        maxLength: 128
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                  schedule:
                    description: schedule is the persisted snapshot schedule.
                    properties:
                      activeRun:
                        description: activeRun holds the binding's single run slot.
                        properties:
                          name:
                            maxLength: 253
                            type: string
                          uid:
                            maxLength: 128
                            type: string
                        required:
                        - name
                        - uid
                        type: object
                      anchor:
                        format: date-time
                        type: string
                      gaps:
                        description: |-
                          gaps are the most recent missed intervals, oldest first. Each was
                          coalesced into one later run; none was assessed.
                        items:
                          description: MissedInterval is a range of scheduled times
                            that were not run.
                          properties:
                            from:
                              format: date-time
                              type: string
                            missed:
                              format: int32
                              minimum: 1
                              type: integer
                            to:
                              format: date-time
                              type: string
                          required:
                          - from
                          - missed
                          - to
                          type: object
                        maxItems: 10
                        type: array
                        x-kubernetes-list-type: atomic
                      interval:
                        description: interval in effect when anchor was set.
                        maxLength: 32
                        minLength: 2
                        type: string
                        x-kubernetes-validations:
                        - message: must be a duration such as 24h, 90m or 2160h; days,
                            cron expressions and signs are not supported
                          rule: self.matches('^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h))+$')
                        - message: must be a positive duration
                          rule: '!self.matches(''^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h))+$'')
                            || duration(self) > duration(''0s'')'
                      lastScheduled:
                        description: lastScheduled is the scheduled time of the newest
                          scheduled run.
                        format: date-time
                        type: string
                      missedTotal:
                        description: |-
                          missedTotal counts every missed scheduled time, including gaps
                          dropped from the bounded list.
                        format: int32
                        minimum: 0
                        type: integer
                      nextDue:
                        format: date-time
                        type: string
                    required:
                    - anchor
                    - interval
                    type: object
                type: object
              conditions:
                description: conditions report Resolved and EngineReady separately.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configurationRevision:
                description: configurationRevision identifies the resolved enforcement
                  configuration.
                maxLength: 128
                type: string
              observedGeneration:
                description: observedGeneration is the binding generation last processed.
                format: int64
                type: integer
              profile:
                description: profile is the profile revision last resolved.
                properties:
                  bundleDigest:
                    description: bundleDigest is the pinned content digest of that
                      profile revision.
                    type: string
                  generation:
                    format: int64
                    type: integer
                  name:
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                required:
                - bundleDigest
                - generation
                - name
                - uid
                type: object
              targetCount:
                description: |-
                  targetCount is the number of matched namespaces. Absent means unknown;
                  zero is a valid resolved scope and never implies a compliance pass.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
