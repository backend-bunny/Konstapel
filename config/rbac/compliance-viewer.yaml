# Read-only access to compliance configuration and resolution status, for
# auditors and platform tooling. Not aggregated into the built-in view role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: konstapel-compliance-viewer
  labels:
    app.kubernetes.io/part-of: konstapel
rules:
  - apiGroups: [compliance.erenius.io]
    resources: [complianceprofiles, compliancebindings, complianceprofiles/status, compliancebindings/status]
    verbs: [get, list, watch]
