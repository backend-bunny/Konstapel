# Platform operators request full-binding runs and read every request and run.
# Admission policy limits them to Binding-scope runs with a Manual trigger;
# Namespace-scope runs and Scheduled/Request triggers are controller-owned.
# Bind with a ClusterRoleBinding to platform subjects only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: konstapel-assessment-operator
  labels:
    app.kubernetes.io/part-of: konstapel
rules:
  - apiGroups: [compliance.erenius.io]
    resources: [assessmentruns]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [compliance.erenius.io]
    resources: [assessmentruns/status, assessmentruns/download, assessmentrequests, assessmentrequests/status]
    verbs: [get, list, watch]
