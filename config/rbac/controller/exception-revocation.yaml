# Gated controller grant for exception revocation processing
# (add-self-service-policy-exceptions task 3.6). It is NOT part of the
# default installation, and the runtime chart refuses to render it
# (exceptions.revocationProcessing.enabled) until it can deploy the exception
# admission webhooks.
#
# Bind it to the controller ServiceAccount (konstapel-system/
# konstapel-controller) with a ClusterRoleBinding only together with
# --exception-revocation-processing, and only after the webhooks in
# config/webhook/exceptions.yaml are registered with failurePolicy Fail and
# served by the controller (--webhook-cert-dir). The validating webhook
# confines the controller identity, learned with the SelfSubjectReview below,
# to releasing the compliance.erenius.io/revocation-history finalizer once
# the revocation record is durable; without that webhook this update/patch
# grant is unrestricted. Remove the binding before removing the webhooks.
# docs/integration/policy-exceptions.md, "Revocation processing", gives the
# enable and disable order.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: konstapel-controller-exception-revocation
  labels:
    app.kubernetes.io/part-of: konstapel
rules:
  # Release the revocation finalizer (an optimistic-lock merge patch).
  - apiGroups: [compliance.erenius.io]
    resources: [complianceexceptions]
    verbs: [update, patch]
  # Learn the controller identity the validating webhook restricts.
  - apiGroups: [authentication.k8s.io]
    resources: [selfsubjectreviews]
    verbs: [create]
  # Verify, before each release, that both webhooks are registered and fail
  # closed; read by name only.
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    resourceNames: [konstapel-exception-acceptance]
    verbs: [get]
