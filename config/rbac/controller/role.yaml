---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: konstapel-controller
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - pods
  - replicationcontrollers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - authorization.k8s.io
  resources:
  - selfsubjectaccessreviews
  verbs:
  - create
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - compliance.erenius.io
  resources:
  - assessmentrequests
  - compliancebindings
  - complianceexceptions
  - complianceprofiles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - compliance.erenius.io
  resources:
  - assessmentrequests/status
  - assessmentruns/status
  - compliancebindings/status
  - complianceexceptions/status
  - complianceprofiles/status
  - evidencedestinations/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - compliance.erenius.io
  resources:
  - assessmentruns
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - compliance.erenius.io
  resources:
  - evidencedestinations
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - compliance.erenius.io
  resources:
  - evidencedestinations/finalizers
  verbs:
  - update
- apiGroups:
  - policies.kyverno.io
  resources:
  - validatingpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - wgpolicyk8s.io
  resources:
  - policyreports
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: konstapel-controller
  namespace: konstapel-system
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
