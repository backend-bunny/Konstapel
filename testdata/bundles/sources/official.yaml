# Central bundle source configuration (ConfigMap key sources.yaml, controller
# namespace). One entry per bundle name; the profile's pinned digest, never a
# tag, selects the content. No credentials or keys live here.
version: 1
sources:
  # Official release: anonymous pull, keyless signing by the dedicated
  # bundle-release workflow on main, using the built-in Sigstore public-good root.
  - name: konstapel-privileged-containers
    repository: ghcr.io/backend-bunny/bundles/konstapel-privileged-containers
    publisher:
      type: keyless
      issuer: https://token.actions.githubusercontent.com
      identity: https://github.com/backend-bunny/Konstapel/.github/workflows/bundle-release.yml@refs/heads/main
      provenance:
        sourceRepository: https://github.com/backend-bunny/Konstapel
        builder: https://github.com/backend-bunny/Konstapel/.github/workflows/bundle-release.yml@refs/heads/main
