scenarios:
  - Resolve restrictive eligibility across bindings
input:
  cluster: kube-system:cluster-a
  bundles:
    - name: example-workload-hardening
      digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
      policies:
        - {name: disallow-privileged-containers, scope: Namespaced}
        - {name: require-run-as-non-root, scope: Namespaced}
        - {name: restrict-capabilities, scope: Namespaced}
        - {name: restrict-cluster-role-bindings, scope: Cluster}
  profiles:
    - metadata: {name: self-service, uid: p-ss, generation: 1}
      spec:
        bundle: {name: example-workload-hardening, digest: sha256:1111111111111111111111111111111111111111111111111111111111111111}
        policies:
          - {name: disallow-privileged-containers, exceptions: {eligibility: SelfService, maxLifetime: 720h}}
    - metadata: {name: no-exceptions, uid: p-forbid, generation: 1}
      spec:
        bundle: {name: example-workload-hardening, digest: sha256:1111111111111111111111111111111111111111111111111111111111111111}
        policies:
          - {name: disallow-privileged-containers, exceptions: {eligibility: Forbidden}}
  bindings:
    - metadata: {name: deny-selfservice, uid: b-ss, generation: 1}
      spec: {profileRef: {name: self-service}, namespaceSelector: {}, mode: Deny}
    # An Audit binding still makes exceptions Forbidden where it applies.
    - metadata: {name: audit-forbidden-production, uid: b-forbid, generation: 1}
      spec: {profileRef: {name: no-exceptions}, namespaceSelector: {matchLabels: {environment: production}}, mode: Audit}
  namespaces:
    - {name: shop-prod, uid: 00000000-0000-0000-0000-000000000001, labels: {environment: production}}
    - {name: shop-dev, uid: 00000000-0000-0000-0000-000000000002, labels: {environment: development}}
    - {name: tools, uid: 00000000-0000-0000-0000-000000000003, labels: {}}
expected:
  bindings:
    - binding: audit-forbidden-production
      targets: [shop-prod]
      contributions: [{policy: disallow-privileged-containers, mode: Audit}]
    - binding: deny-selfservice
      targets: [shop-dev, shop-prod, tools]
      contributions: [{policy: disallow-privileged-containers, mode: Deny}]
  eligibility:
    - {namespace: shop-dev, policy: disallow-privileged-containers, effective: SelfService, maxLifetime: 720h0m0s, contributors: [deny-selfservice]}
    - {namespace: shop-prod, policy: disallow-privileged-containers, effective: Forbidden, contributors: [audit-forbidden-production, deny-selfservice]}
    - {namespace: tools, policy: disallow-privileged-containers, effective: SelfService, maxLifetime: 720h0m0s, contributors: [deny-selfservice]}
