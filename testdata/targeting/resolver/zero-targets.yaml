scenarios:
  - No namespace matches
input:
  cluster: kube-system:cluster-a
  bundles:
    - name: example-workload-hardening
      digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
      policies:
        - {name: disallow-privileged-containers, scope: Namespaced}
        - {name: require-run-as-non-root, scope: Namespaced}
        - {name: restrict-capabilities, scope: Namespaced}
        - {name: restrict-cluster-role-bindings, scope: Cluster}
  profiles:
    - metadata: {name: baseline, uid: p-baseline, generation: 1}
      spec:
        bundle: {name: example-workload-hardening, digest: sha256:1111111111111111111111111111111111111111111111111111111111111111}
        policies: [{name: disallow-privileged-containers}]
  bindings:
    - metadata: {name: deny-regulated, uid: b-reg, generation: 1}
      spec:
        profileRef: {name: baseline}
        namespaceSelector: {matchExpressions: [{key: compliance.erenius.io/regulated, operator: Exists}]}
        mode: Deny
  namespaces:
    - {name: shop-prod, uid: 00000000-0000-0000-0000-000000000001, labels: {environment: production}}
    - {name: shop-dev, uid: 00000000-0000-0000-0000-000000000002, labels: {environment: development}}
    - {name: tools, uid: 00000000-0000-0000-0000-000000000003, labels: {}}
expected:
  # A resolved, explicit zero, still contributed so new matching namespaces are
  # enforced. Never a compliance pass.
  bindings:
    - binding: deny-regulated
      targets: []
      contributions: [{policy: disallow-privileged-containers, mode: Deny}]
  eligibility: []
