# Generated by `go test ./internal/charttest -run TestStarterRules -update` from
# releases.cases.yaml and the rendered rules; run with promtool test rules.
evaluation_interval: 1m
rule_files:
- konstapel.rules.yml
- konstapel-b.rules.yml
tests:
- alert_rule_test:
  - alertname: KonstapelBindingUnresolved
    eval_time: 10m
    exp_alerts:
    - exp_annotations:
        description: The Resolved condition of ComplianceBinding payments is false
          or unknown for its current generation. Its previous enforcement stays in
          force; changes to it are not delivered.
        runbook_url: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelbindingunresolved
        summary: ComplianceBinding payments is not resolved.
      exp_labels:
        app_kubernetes_io_instance: konstapel
        binding: payments
        job: konstapel-controller-metrics
        namespace: konstapel-system
        severity: warning
  - alertname: KonstapelEngineUnavailable
    eval_time: 10m
    exp_alerts:
    - exp_annotations:
        description: The assessment capability is false (API missing or access denied)
          or unknown (dependency cannot be asked).
        runbook_url: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelengineunavailable
        summary: Kyverno capability assessment is unavailable to Konstapel.
      exp_labels:
        app_kubernetes_io_instance: konstapel-b
        capability: assessment
        job: konstapel-controller-metrics
        namespace: konstapel-system
        severity: warning
  - alertname: KonstapelObservationUnavailable
    eval_time: 10m
    exp_alerts: []
  - alertname: KonstapelMetricsUnavailable
    eval_time: 10m
    exp_alerts: []
  input_series:
  - series: up{app_kubernetes_io_instance="konstapel",container="controller",endpoint="https",instance="10.0.0.10:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-0",service="konstapel-controller-metrics"}
    values: 1x30
  - series: up{app_kubernetes_io_instance="konstapel",container="controller",endpoint="https",instance="10.0.0.11:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-1",service="konstapel-controller-metrics"}
    values: 1x30
  - series: up{app_kubernetes_io_instance="konstapel-b",container="controller",endpoint="https",instance="10.1.0.10:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-0",service="konstapel-controller-metrics"}
    values: 1x30
  - series: up{app_kubernetes_io_instance="konstapel-b",container="controller",endpoint="https",instance="10.1.0.11:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-1",service="konstapel-controller-metrics"}
    values: 1x30
  - series: konstapel_observation_enabled{app_kubernetes_io_instance="konstapel",container="controller",endpoint="https",instance="10.0.0.10:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-0",service="konstapel-controller-metrics",domain="targeting"}
    values: 1x30
  - series: konstapel_observation_enabled{app_kubernetes_io_instance="konstapel",container="controller",endpoint="https",instance="10.0.0.11:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-1",service="konstapel-controller-metrics",domain="targeting"}
    values: 1x30
  - series: konstapel_observation_enabled{app_kubernetes_io_instance="konstapel-b",container="controller",endpoint="https",instance="10.1.0.10:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-0",service="konstapel-controller-metrics",domain="targeting"}
    values: 1x30
  - series: konstapel_observation_enabled{app_kubernetes_io_instance="konstapel-b",container="controller",endpoint="https",instance="10.1.0.11:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-1",service="konstapel-controller-metrics",domain="targeting"}
    values: 1x30
  - series: konstapel_observation_ready{app_kubernetes_io_instance="konstapel",container="controller",endpoint="https",instance="10.0.0.10:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-0",service="konstapel-controller-metrics",domain="targeting"}
    values: 1x30
  - series: konstapel_observation_ready{app_kubernetes_io_instance="konstapel",container="controller",endpoint="https",instance="10.0.0.11:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-1",service="konstapel-controller-metrics",domain="targeting"}
    values: "0x30"
  - series: konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",container="controller",endpoint="https",instance="10.1.0.10:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-0",service="konstapel-controller-metrics",domain="targeting"}
    values: "0x30"
  - series: konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",container="controller",endpoint="https",instance="10.1.0.11:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-1",service="konstapel-controller-metrics",domain="targeting"}
    values: 1x30
  - series: konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel",container="controller",endpoint="https",instance="10.0.0.10:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-0",service="konstapel-controller-metrics",domain="targeting"}
    values: 0+60x30
  - series: konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",container="controller",endpoint="https",instance="10.1.0.11:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-1",service="konstapel-controller-metrics",domain="targeting"}
    values: 0+60x30
  - series: konstapel_binding_condition{app_kubernetes_io_instance="konstapel",container="controller",endpoint="https",instance="10.0.0.10:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-0",service="konstapel-controller-metrics",binding="payments",condition="Resolved",status="false"}
    values: 1x30
  - series: konstapel_binding_condition{app_kubernetes_io_instance="konstapel",container="controller",endpoint="https",instance="10.0.0.10:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-0",service="konstapel-controller-metrics",binding="payments",condition="Resolved",status="true"}
    values: "0x30"
  - series: konstapel_binding_condition{app_kubernetes_io_instance="konstapel-b",container="controller",endpoint="https",instance="10.1.0.11:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-1",service="konstapel-controller-metrics",binding="payments",condition="Resolved",status="false"}
    values: "0x30"
  - series: konstapel_binding_condition{app_kubernetes_io_instance="konstapel-b",container="controller",endpoint="https",instance="10.1.0.11:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-1",service="konstapel-controller-metrics",binding="payments",condition="Resolved",status="true"}
    values: 1x30
  - series: konstapel_capability_condition{app_kubernetes_io_instance="konstapel",container="controller",endpoint="https",instance="10.0.0.10:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-0",service="konstapel-controller-metrics",capability="assessment",status="true"}
    values: 1x30
  - series: konstapel_capability_condition{app_kubernetes_io_instance="konstapel-b",container="controller",endpoint="https",instance="10.1.0.11:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-1",service="konstapel-controller-metrics",capability="assessment",status="false"}
    values: 1x30
  interval: 1m
  name: identical binding names in two releases stay separate
- alert_rule_test:
  - alertname: KonstapelMetricsUnavailable
    eval_time: 10m
    exp_alerts:
    - exp_annotations:
        description: Prometheus has no successful scrape of the Konstapel release
          selected by this alert's labels. No other Konstapel alert can fire meanwhile;
          this says nothing about enforcement, assessments or evidence.
        runbook_url: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelmetricsunavailable
        summary: Konstapel controller metrics are not being scraped.
      exp_labels:
        app_kubernetes_io_instance: konstapel-b
        job: konstapel-controller-metrics
        namespace: konstapel-system
        severity: warning
  input_series:
  - series: up{app_kubernetes_io_instance="konstapel",container="controller",endpoint="https",instance="10.0.0.10:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-0",service="konstapel-controller-metrics"}
    values: 1x30
  - series: up{app_kubernetes_io_instance="konstapel-b",container="controller",endpoint="https",instance="10.1.0.10:8443",job="konstapel-controller-metrics",namespace="konstapel-system",pod="konstapel-0",service="konstapel-controller-metrics"}
    values: 1x2 0x30
  interval: 1m
  name: one release losing its targets does not hide behind the other
