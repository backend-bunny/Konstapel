# Generated by `go test ./internal/charttest -run TestStarterRules -update`:
# spec.groups of the PrometheusRule that `helm template konstapel-b charts/konstapel`
# renders with metrics, the ServiceMonitor and the PrometheusRule enabled.
groups:
- name: konstapel-availability
  rules:
  - alert: KonstapelMetricsUnavailable
    annotations:
      description: Prometheus has no successful scrape of the Konstapel release selected
        by this alert's labels. No other Konstapel alert can fire meanwhile; this
        says nothing about enforcement, assessments or evidence.
      runbook_url: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelmetricsunavailable
      summary: Konstapel controller metrics are not being scraped.
    expr: |-
      max by (app_kubernetes_io_instance, job, namespace) (up{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system"}) == 0
      or
      absent(up{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system"})
    for: 5m
    labels:
      severity: warning
  - alert: KonstapelObservationUnavailable
    annotations:
      description: The enabled {{ $labels.domain }} domain has no fresh, ready projection
        on exactly one replica. Its alerts cannot fire, and their resolution does
        not mean recovery.
      runbook_url: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelobservationunavailable
      summary: Konstapel's {{ $labels.domain }} observation is unavailable.
    expr: |-
      max by (app_kubernetes_io_instance, job, namespace, domain) (konstapel_observation_enabled{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system"}) == 1
      unless on (app_kubernetes_io_instance, job, namespace, domain)
      ((konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system"} < 240) and on (app_kubernetes_io_instance, job, namespace, domain) (count by (app_kubernetes_io_instance, job, namespace, domain) (konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system"} < 240) == 1))
    for: 5m
    labels:
      severity: warning
- name: konstapel-operations
  rules:
  - alert: KonstapelAssessmentOverdue
    annotations:
      description: ComplianceBinding {{ $labels.binding }} has scheduled work outstanding
        past its due time, collection timeout and grace. Namespace requests and diagnostic
        runs do not meet it.
      runbook_url: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelassessmentoverdue
      summary: Scheduled assessment of {{ $labels.binding }} is overdue.
    expr: |-
      time()
      - max by (app_kubernetes_io_instance, job, namespace, binding) (konstapel_binding_scheduled_due_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system"} and on (app_kubernetes_io_instance, job, namespace, instance) ((konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="assessment"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="assessment"} < 240) and on (app_kubernetes_io_instance, job, namespace, domain) (count by (app_kubernetes_io_instance, job, namespace, domain) (konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="assessment"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="assessment"} < 240) == 1)))
      - max by (app_kubernetes_io_instance, job, namespace, binding) (konstapel_binding_collection_timeout_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system"} and on (app_kubernetes_io_instance, job, namespace, instance) ((konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="assessment"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="assessment"} < 240) and on (app_kubernetes_io_instance, job, namespace, domain) (count by (app_kubernetes_io_instance, job, namespace, domain) (konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="assessment"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="assessment"} < 240) == 1)))
      > 600
    for: 5m
    labels:
      severity: warning
  - alert: KonstapelBindingUnresolved
    annotations:
      description: The Resolved condition of ComplianceBinding {{ $labels.binding
        }} is false or unknown for its current generation. Its previous enforcement
        stays in force; changes to it are not delivered.
      runbook_url: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelbindingunresolved
      summary: ComplianceBinding {{ $labels.binding }} is not resolved.
    expr: |-
      max by (app_kubernetes_io_instance, job, namespace, binding) (
        konstapel_binding_condition{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system", condition="Resolved", status!="true"} == 1
        and on (app_kubernetes_io_instance, job, namespace, instance) ((konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="targeting"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="targeting"} < 240) and on (app_kubernetes_io_instance, job, namespace, domain) (count by (app_kubernetes_io_instance, job, namespace, domain) (konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="targeting"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="targeting"} < 240) == 1))
      )
    for: 10m
    labels:
      severity: warning
  - alert: KonstapelCleanupBlocked
    annotations:
      description: 'Expired evidence packages are retained past their expiry: storage
        refuses deletion, or deletion is unconfirmed more than an hour after the oldest
        expiry. Records outlive deleted bindings, so check every AssessmentRun.'
      runbook_url: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelcleanupblocked
      summary: Konstapel evidence retention cleanup is blocked or late.
    expr: |-
      max by (app_kubernetes_io_instance, job, namespace) (konstapel_cleanup_blocked{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system"} and on (app_kubernetes_io_instance, job, namespace, instance) ((konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} < 240) and on (app_kubernetes_io_instance, job, namespace, domain) (count by (app_kubernetes_io_instance, job, namespace, domain) (konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} < 240) == 1))) > 0
      or
      (
        time() - max by (app_kubernetes_io_instance, job, namespace) (konstapel_cleanup_oldest_expiry_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system"} and on (app_kubernetes_io_instance, job, namespace, instance) ((konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} < 240) and on (app_kubernetes_io_instance, job, namespace, domain) (count by (app_kubernetes_io_instance, job, namespace, domain) (konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} < 240) == 1))) > 3600
        and on (app_kubernetes_io_instance, job, namespace)
        max by (app_kubernetes_io_instance, job, namespace) (konstapel_cleanup_pending{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system"} and on (app_kubernetes_io_instance, job, namespace, instance) ((konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} < 240) and on (app_kubernetes_io_instance, job, namespace, domain) (count by (app_kubernetes_io_instance, job, namespace, domain) (konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} < 240) == 1))) > 0
      )
    for: 15m
    labels:
      severity: warning
  - alert: KonstapelEngineUnavailable
    annotations:
      description: The {{ $labels.capability }} capability is false (API missing or
        access denied) or unknown (dependency cannot be asked).
      runbook_url: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelengineunavailable
      summary: Kyverno capability {{ $labels.capability }} is unavailable to Konstapel.
    expr: |-
      max by (app_kubernetes_io_instance, job, namespace, capability) (
        konstapel_capability_condition{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system", status!="true"} == 1
        and on (app_kubernetes_io_instance, job, namespace, instance) ((konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="targeting"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="targeting"} < 240) and on (app_kubernetes_io_instance, job, namespace, domain) (count by (app_kubernetes_io_instance, job, namespace, domain) (konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="targeting"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="targeting"} < 240) == 1))
      )
    for: 10m
    labels:
      severity: warning
  - alert: KonstapelPublicationFailing
    annotations:
      description: Assessment runs are retrying publication after repeated failed
        attempts. Their assessment results stand; their evidence packages are not
        committed.
      runbook_url: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelpublicationfailing
      summary: Konstapel evidence publication is failing.
    expr: |-
      max by (app_kubernetes_io_instance, job, namespace) (
        (konstapel_publication_failed{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system"} - (konstapel_publication_retained_signing_failures{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system"} or konstapel_publication_failed{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system"} * 0))
        and on (app_kubernetes_io_instance, job, namespace, instance) ((konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} < 240) and on (app_kubernetes_io_instance, job, namespace, domain) (count by (app_kubernetes_io_instance, job, namespace, domain) (konstapel_observation_ready{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} == 1 and time() - konstapel_observation_updated_timestamp_seconds{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system",domain="evidence_storage"} < 240) == 1))
      ) > 0
      and on (app_kubernetes_io_instance, job, namespace)
      sum by (app_kubernetes_io_instance, job, namespace) (increase(konstapel_operation_attempts_total{app_kubernetes_io_instance="konstapel-b",job="konstapel-controller-metrics",namespace="konstapel-system", operation="evidence_publication", result="failure"}[15m])) >= 3
    for: 2m
    labels:
      severity: warning
