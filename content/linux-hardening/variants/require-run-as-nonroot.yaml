apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    compliance.erenius.io/variant-of: kyverno/policies@fac1ccda72ab53594921ca1c040ac90b80afadcd pod-security-vpol/restricted/require-run-as-nonroot
    compliance.erenius.io/source-sha256: 5276cb3c4f3d782604334d40cb40e659ee5d9ffefb190b9d52ab880e74bbb3b8
    policies.kyverno.io/title: Require runAsNonRoot in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Restricted) in ValidatingPolicy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: "1.30+"
    policies.kyverno.io/description: >-
      Containers must run as non-root users. This policy ensures that every container sets
      `runAsNonRoot` to `true` or inherits it from the Pod, and that neither sets it to `false`.
      Missing or null init and ephemeral container lists are treated as empty.
      Konstapel variant: `spec.hostUsers: false` is not an exemption (a workload that cannot
      run as non-root needs a recorded exception), and explicit Windows Pods are outside scope.
spec:
  validationActions:
     - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods", "replicationcontrollers"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["pods/ephemeralcontainers"]
  variables:
    - name: podSpec
      expression: >-
        object.spec.?jobTemplate.?spec.?template.?spec.orValue(
        object.spec.?template.?spec.orValue(object.spec))
    - name: ctnrs
      expression: >-
        variables.podSpec.containers +
        (variables.podSpec.?initContainers.orValue([]) == null ? [] :
        variables.podSpec.?initContainers.orValue([])) +
        (variables.podSpec.?ephemeralContainers.orValue([]) == null ? [] :
        variables.podSpec.?ephemeralContainers.orValue([]))
    - name: isWindowsPod
      expression: "variables.podSpec.?os.?name.orValue('') == 'windows'"
  validations:
    - expression: >-
        variables.isWindowsPod ||
        (variables.podSpec.?securityContext.?runAsNonRoot.orValue(true) == true &&
          variables.ctnrs.all(c,
            c.image in exceptions.allowedImages ||
            c.?securityContext.?runAsNonRoot.orValue(
              variables.podSpec.?securityContext.?runAsNonRoot.orValue(false)) == true))
      message: >-
        Running as root is not allowed. Every container (spec.containers[*], spec.initContainers[*], and
        spec.ephemeralContainers[*]) must set securityContext.runAsNonRoot to `true`, or inherit `true`
        from spec.securityContext.runAsNonRoot. Neither spec.securityContext.runAsNonRoot nor
        container-level securityContext.runAsNonRoot may be set to `false`. Setting spec.hostUsers
        to `false` does not exempt a Pod. Windows Pods are exempt.
