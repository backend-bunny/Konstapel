apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-capabilities-strict
  annotations:
    compliance.erenius.io/variant-of: kyverno/policies@fac1ccda72ab53594921ca1c040ac90b80afadcd pod-security-vpol/restricted/disallow-capabilities-strict
    compliance.erenius.io/source-sha256: 30d3ffefc63a00badbf7e5805f0c14709ac8c146b11260415b92e768a5fd4830
    policies.kyverno.io/title: Disallow Capabilities (Strict) in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Restricted) in ValidatingPolicy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: "1.30+"
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Adding capabilities other than `NET_BIND_SERVICE` is disallowed. In addition,
      all containers must explicitly drop `ALL` capabilities.
spec:
  validationActions:
     - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods", "replicationcontrollers"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["pods/ephemeralcontainers"]
  variables:
    - name: podSpec
      expression: >-
        object.spec.?jobTemplate.?spec.?template.?spec.orValue(
        object.spec.?template.?spec.orValue(object.spec))
    - name: allContainers
      expression: >-
        variables.podSpec.?containers.orValue([]) +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
    - name: isWindowsPod
      expression: "variables.podSpec.?os.?name.orValue('') == 'windows'"
  validations:
    - expression: >-
        variables.isWindowsPod ||
        variables.allContainers.all(container,
          container.?securityContext.?capabilities.?drop.orValue([]).exists(capability, capability == 'ALL'))
      message: >-
        Containers must drop `ALL` capabilities. Windows Pods are exempt.
    - expression: >-
        variables.isWindowsPod ||
        variables.allContainers.all(container,
          container.image in exceptions.allowedImages ||
          container.?securityContext.?capabilities.?add.orValue([]).all(capability,
            capability == 'NET_BIND_SERVICE' || capability in exceptions.allowedValues))
      message: >-
        Any capabilities added other than NET_BIND_SERVICE are disallowed. Windows Pods are exempt.
