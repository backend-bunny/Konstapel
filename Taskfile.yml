version: "3"

# Run inside direnv/devbox shell, or use: devbox run -- task check
tasks:
  default:
    silent: true
    cmd: task --list

  build:
    desc: Build the runner and C2P provider
    cmd: scripts/build.sh

  test:
    desc: Run Go tests and CI/logging regression tests
    cmds:
      - go test -mod=readonly ./...
      - python3 -m unittest discover -s scripts/ci -p 'test_*.py'

  lint:
    desc: Check Go formatting, vet, generated API files, Helm charts, and shell syntax
    cmds:
      - |
        unformatted=$(gofmt -l api cmd internal)
        if [ -n "$unformatted" ]; then
          printf 'Run gofmt on:\n%s\n' "$unformatted"
          exit 1
        fi
      - go vet -mod=readonly ./...
      - go vet -mod=readonly -tags live ./internal/targeting/ ./internal/controller/
      - scripts/generate.sh --check
      - scripts/charts/check.sh
      - |
        set -eu
        bash -n .envrc
        bash -n scripts/runtime.env
        find scripts -name '*.sh' -print0 | xargs -0 -n 1 bash -n

  content:check:
    desc: Verify vendored policy, OSCAL, and schema checksums
    cmd: sha256sum -c content/SHA256SUMS

  policies:test:
    desc: Run the vendored and rendered-policy Kyverno CLI fixtures
    cmds:
      - kyverno test content/upstream/kyverno --require-tests --remove-color
      - kyverno test testdata/linux-hardening --require-tests --remove-color
      - kyverno test testdata/targeting/rendered --require-tests --remove-color

  deps:check:
    desc: Validate Renovate configuration, dependency locks, and runtime pins
    cmds:
      - renovate-config-validator --strict renovate.json
      - scripts/check-dependencies.sh

  check:
    desc: Run the same checks as CI (no cluster required)
    cmds:
      - task: deps:check
      - task: content:check
      - task: build
      - task: lint
      - task: test
      - task: policies:test

  acceptance:
    desc: Run disposable-cluster acceptance (GROUP defaults to all; requires Docker and fresh OUTPUT)
    vars:
      GROUP: '{{default "all" .GROUP}}'
    requires:
      vars: [OUTPUT]
    env:
      KONSTAPEL_TASK_OUTPUT: '{{.OUTPUT}}'
      KONSTAPEL_TASK_GROUP: '{{.GROUP}}'
    cmds:
      - scripts/acceptance.sh "$KONSTAPEL_TASK_OUTPUT" "$KONSTAPEL_TASK_GROUP"

  charts:package:
    desc: Package and freeze both charts for a verified image digest (clean checkout; fresh OUT; IMAGE_DIGEST=sha256:...)
    requires:
      vars: [OUT, IMAGE_DIGEST]
    env:
      KONSTAPEL_TASK_OUT: '{{.OUT}}'
      KONSTAPEL_TASK_DIGEST: '{{.IMAGE_DIGEST}}'
    cmds:
      - scripts/charts/package.sh "$KONSTAPEL_TASK_OUT" "$KONSTAPEL_TASK_DIGEST"

  charts:acceptance:
    desc: Run installed-chart acceptance on frozen ARCHIVES and IMAGE (repo@sha256) and bind the result (requires Docker; fresh OUTPUT)
    requires:
      vars: [OUTPUT, ARCHIVES, IMAGE]
    env:
      KONSTAPEL_TASK_OUTPUT: '{{.OUTPUT}}'
      KONSTAPEL_TASK_ARCHIVES: '{{.ARCHIVES}}'
      KONSTAPEL_TASK_IMAGE: '{{.IMAGE}}'
    cmds:
      - scripts/charts/acceptance.sh "$KONSTAPEL_TASK_OUTPUT" "$KONSTAPEL_TASK_ARCHIVES" "$KONSTAPEL_TASK_IMAGE"

  test:failures:
    desc: Run disposable-cluster failure probes (requires Docker and a fresh OUTPUT)
    requires:
      vars: [OUTPUT]
    env:
      KONSTAPEL_TASK_OUTPUT: '{{.OUTPUT}}'
    cmds:
      - scripts/test-failures.sh "$KONSTAPEL_TASK_OUTPUT"

  clean:
    desc: Remove build outputs and Task cache; retain assessment evidence
    cmd: rm -rf -- bin .task

  image:build:
    desc: Build the melange package, locked apko image, SBOMs and license notices
    cmd: scripts/image/build.sh

  image:lock:
    desc: Refresh the reviewed Wolfi runtime lock and build the image
    cmd: scripts/image/build.sh lock

  image:test:
    desc: Test the built non-root image without network access (requires Docker)
    cmd: scripts/image/test.sh

  image:publish-dry-run:
    desc: Validate publish inputs and print the commit tag without publishing
    cmd: scripts/image/publish.sh --dry-run
