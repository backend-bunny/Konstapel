name: publish
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish again (vX.Y.Z); leave empty for a commit build
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
        default: ''
    outputs:
      digest:
        description: Published and verified image digest
        value: ${{ jobs.publish.outputs.digest }}
permissions:
  contents: read
concurrency:
  group: publish-konstapel
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/backend-bunny/konstapel
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run's github.sha may be newer than the tested commit.
          ref: ${{ github.event.workflow_run.head_sha || inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release target
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
      - uses: ./.github/actions/setup-tools
        with:
          image: 'true'
      - name: Require full acceptance for this source commit
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          args=(--commit "$(git rev-parse HEAD)")
          if [[ -n "$ACCEPTANCE_RUN_ID" ]]; then
            args+=(--run-id "$ACCEPTANCE_RUN_ID")
          fi
          devbox run -- python3 scripts/ci/require-acceptance.py "${args[@]}"
      - run: devbox run -- task check
      - run: devbox run -- task image:build
      - run: devbox run -- task image:test
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish tested packages
        id: publish
        run: |
          devbox run -- scripts/image/publish.sh
          echo "digest=$(cat out/image/digest)" >> "$GITHUB_OUTPUT"
      - name: Sign and attest SBOMs, sources and license notices
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          devbox run -- cosign sign --yes "$IMAGE@$DIGEST"
          devbox run -- cosign attest --yes --type spdxjson --predicate out/image/sbom-x86_64.spdx.json "$IMAGE@$DIGEST"
          devbox run -- cosign attest --yes --type spdxjson --predicate out/image/sbom-complete.spdx.json "$IMAGE@$DIGEST"
          devbox run -- cosign attest --yes --type https://github.com/backend-bunny/Konstapel/sources/v1 --predicate out/image/sources.json "$IMAGE@$DIGEST"
          devbox run -- cosign attest --yes --type https://github.com/backend-bunny/Konstapel/notices/v1 --predicate out/image/notices.json "$IMAGE@$DIGEST"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify published signature and attestations
        id: verify
        timeout-minutes: 5
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/image/verification
          identity='^https://github.com/backend-bunny/Konstapel/\.github/workflows/(publish|release-please)\.yml@refs/heads/main$'
          devbox run -- cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$DIGEST" > out/image/verification/signature.json
          count=0
          for type in spdxjson https://github.com/backend-bunny/Konstapel/sources/v1 https://github.com/backend-bunny/Konstapel/notices/v1; do
            count=$((count + 1))
            devbox run -- cosign verify-attestation --type "$type" --certificate-identity-regexp "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$DIGEST" > "out/image/verification/attestation-$count.jsonl"
            printf 'Verified %s\n' "$type"
          done
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo backend-bunny/Konstapel --format json > out/image/verification/provenance.json
      - name: Image summary
        if: always()
        env:
          PUBLISH_VERIFICATION: ${{ steps.verify.outcome }}
        run: devbox run -- python3 scripts/image/summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-image-evidence
          path: |
            out/image/verification/
            out/image/digest
            out/image/sources.md
            out/image/notices.md
          retention-days: 14
