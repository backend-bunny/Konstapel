name: image
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          image: 'true'
      - run: devbox run -- task image:build
      - run: devbox run -- task image:test
      - run: devbox run -- task image:publish-dry-run
      - name: Dependency locks remain unchanged
        run: git diff --exit-code -- devbox.json devbox.lock go.mod go.sum apko.lock.json
      - name: Image summary
        if: always()
        run: devbox run -- python3 scripts/image/summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-evidence
          path: |
            out/image/*.json
            out/image/*.md
            out/image/*.sha256
            packages/x86_64/*.attest.tar.gz
          retention-days: 14
