name: image
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          image: 'true'
      - run: devbox run -- task image:build
      - run: devbox run -- task image:test
      - run: devbox run -- task image:publish-dry-run
      - name: Dependency locks remain unchanged
        run: git diff --exit-code -- devbox.json devbox.lock go.mod go.sum apko.lock.json
      - name: Image summary
        if: always()
        run: devbox run -- python3 scripts/image/summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: image-evidence
          path: |
            out/image/*.json
            out/image/*.md
            out/image/*.sha256
            packages/x86_64/*.attest.tar.gz
          retention-days: 14
