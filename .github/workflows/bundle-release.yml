name: bundle-release
# Releases one policy bundle independently of the application, image and
# charts: validate a reviewed main commit, package exactly that commit into a
# frozen OCI layout, run its policy fixtures against the frozen bytes and
# record them, create or verify its bundle/<name>/vX.Y.Z tag, publish the
# frozen bytes write-once to the bundle registry and read them back
# anonymously, sign and attest exactly that digest with this workflow's OIDC
# identity, and verify the result anonymously under the checked-in official
# publisher rule (bundles/official-sources.yaml) before reporting it complete,
# and only then announce it: render its notes and create or update its GitHub
# release.
# The version comes from bundles/<name>/definition.json at that commit. This
# workflow never calls the image or chart publishers and never reads the
# application release automation's state (docs/policy-bundles.md#release-a-bundle).
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: Bundle name (directory under bundles/)
        type: string
        required: true
      commit:
        description: Full 40-character reviewed source commit on main
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    # Explicit bash runs with -eo pipefail, so a failing tool fails its step.
    shell: bash
concurrency:
  # One release of a bundle at a time; never cancel a release in progress.
  group: bundle-release-${{ inputs.bundle }}
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.request.outputs.version }}
      tag: ${{ steps.request.outputs.tag }}
    env:
      BUNDLE: ${{ inputs.bundle }}
      SOURCE_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: ancestry on origin/main and existing tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Validate the release request
        id: request
        run: >-
          devbox run -- go run -mod=readonly ./cmd/bundlerelease verify
          -name "$BUNDLE" -commit "$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Package the source commit
        run: |
          git worktree add --detach "$RUNNER_TEMP/source" "$SOURCE_COMMIT"
          devbox run -- bash "$RUNNER_TEMP/source/scripts/bundles/package.sh" "$BUNDLE" "$RUNNER_TEMP/bundle"
      - name: Test and freeze the package
        # Runs the declarative policy fixtures against the unpacked frozen
        # layer and writes publication-record.json bound to those bytes.
        run: >-
          devbox run -- go run -mod=readonly ./cmd/bundlerelease freeze
          -name "$BUNDLE" -commit "$SOURCE_COMMIT" -package "$RUNNER_TEMP/bundle"
          | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify the frozen package
        run: >-
          devbox run -- go run -mod=readonly ./cmd/bundlerelease verify
          -name "$BUNDLE" -commit "$SOURCE_COMMIT" -package "$RUNNER_TEMP/bundle"
          | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain the frozen package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ steps.request.outputs.name }}-${{ steps.request.outputs.version }}
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
          retention-days: 14
  tag:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      # Only to push a new bundle/<name>/vX.Y.Z tag; existing tags are verified, never moved.
      contents: write
    env:
      BUNDLE: ${{ inputs.bundle }}
      SOURCE_COMMIT: ${{ inputs.commit }}
      BUNDLE_VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: ./.github/actions/setup-tools
      - name: Create or verify the release tag
        run: >-
          devbox run -- go run -mod=readonly ./cmd/bundlerelease tag
          -name "$BUNDLE" -commit "$SOURCE_COMMIT" -version "$BUNDLE_VERSION"
          | tee -a "$GITHUB_STEP_SUMMARY"
  publish:
    # After the tag job: a registry version is only ever published for a
    # version whose Git tag marks the source commit. Signing happens in this
    # job because its proofs are registry writes too: a separate signing job
    # would need packages: write as well and leave an unsigned publication
    # reported between jobs.
    needs: [package, tag]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      # Only to push the frozen bundle and its proofs; nothing else in this
      # workflow writes to the registry.
      packages: write
      # Only to sign the published digest keylessly as this workflow on main,
      # the identity bundles/official-sources.yaml requires. No other job
      # can request an OIDC token.
      id-token: write
    env:
      BUNDLE: ${{ inputs.bundle }}
      SOURCE_COMMIT: ${{ inputs.commit }}
      BUNDLE_VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: ancestry and the release tag the tag job
          # made. The publisher rule is read from this main checkout, never
          # from the packaged source or the artifact.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Retrieve the frozen package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-${{ inputs.bundle }}-${{ needs.package.outputs.version }}
          path: ${{ runner.temp }}/bundle
      - name: Re-verify the frozen package
        run: >-
          devbox run -- go run -mod=readonly ./cmd/bundlerelease verify
          -name "$BUNDLE" -commit "$SOURCE_COMMIT" -package "$RUNNER_TEMP/bundle"
      - name: Publish write-once, read back anonymously, then sign and attest the digest
        id: publish
        # The registry token reaches the tool only through this step's
        # environment and Cosign only through a private temporary Docker
        # config. Proofs are made over the published digest, never a tag,
        # and only for the kinds still missing. This step never reports the
        # release complete.
        env:
          BUNDLE_REGISTRY_USERNAME: ${{ github.actor }}
          BUNDLE_REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/publication"
          devbox run -- go run -mod=readonly ./cmd/bundlerelease publish \
            -name "$BUNDLE" -commit "$SOURCE_COMMIT" -version "$BUNDLE_VERSION" \
            -package "$RUNNER_TEMP/bundle" -out "$RUNNER_TEMP/publication/publication.json" \
            -record-out "$RUNNER_TEMP/publication/record.json" \
            -signing keyless | tee -a "$GITHUB_STEP_SUMMARY" "$GITHUB_OUTPUT"
      - name: Verify the release as a consumer
        # Anonymous retrieval by digest through the consumer's adapter, the
        # signature and provenance under the official publisher rule and the
        # embedded Sigstore root, then the content. Only this step reports
        # the release complete.
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: >-
          devbox run -- go run -mod=readonly ./cmd/bundlerelease verify-release
          -name "$BUNDLE" -digest "$DIGEST" -record "$RUNNER_TEMP/publication/record.json"
          -out "$RUNNER_TEMP/publication/verification.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain the publication and verification records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ inputs.bundle }}-${{ needs.package.outputs.version }}-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication/
          if-no-files-found: warn
          retention-days: 90
  release-notes:
    # Announce the release only after publish has verified it end to end as a
    # consumer would: the notes are rendered from the frozen package and the
    # COMPLETE verification record, and rendering refuses anything else.
    needs: [package, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      # Only to create or update the GitHub release of the bundle tag.
      contents: write
    env:
      BUNDLE: ${{ inputs.bundle }}
      BUNDLE_VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Retrieve the frozen package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-${{ inputs.bundle }}-${{ needs.package.outputs.version }}
          path: ${{ runner.temp }}/bundle
      - name: Retrieve the verification record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-${{ inputs.bundle }}-${{ needs.package.outputs.version }}-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
      - name: Render the notes and announce the release
        id: notes
        # The GitHub token reaches the tool only through this step's
        # environment. An identical release is left untouched, a changed one
        # is updated, and the release never becomes the repository's latest.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          devbox run -- go run -mod=readonly ./cmd/bundlerelease release-notes \
            -name "$BUNDLE" -package "$RUNNER_TEMP/bundle" \
            -verification "$RUNNER_TEMP/publication/verification.json" \
            -out "$RUNNER_TEMP/release-notes.md" -announce | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Show the notes in the run summary
        run: cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
