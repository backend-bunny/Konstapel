name: test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Superseded PRs can stop. Each main commit must finish its publication gate.
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  acceptance-scope:
    runs-on: ubuntu-26.04
    outputs:
      required: ${{ steps.scope.outputs.required }}
      reason: ${{ steps.scope.outputs.reason }}
      groups: ${{ steps.scope.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the complete PR diff
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/ci/acceptance-scope.sh >> "$GITHUB_OUTPUT"
          echo "groups=$(jq -c 'keys' scripts/acceptance-groups.json)" >> "$GITHUB_OUTPUT"
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|build|deps|docs|ci|chore|test|refactor|style)(\([^)]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo 'Use a Conventional Commit PR title, for example: feat: add policy support' >&2
            exit 1
          fi
      - uses: ./.github/actions/setup-tools
      - run: devbox run -- task check
      - name: Verify checks did not modify dependency locks
        run: git diff --exit-code -- devbox.json devbox.lock go.mod go.sum
  acceptance-live:
    name: acceptance-live (${{ matrix.group }})
    needs: acceptance-scope
    if: needs.acceptance-scope.outputs.required == 'true'
    # Each group owns a runner, cluster, and any S3 services. Tests inside a
    # group stay sequential: recovery deliberately stops Kyverno controllers.
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.acceptance-scope.outputs.groups) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          user-namespaces: ${{ matrix.group == 'admission' }}
          # The charts group builds the controller image it installs.
          image: ${{ matrix.group == 'charts' }}
      - name: Run acceptance
        env:
          ACCEPTANCE_GROUP: ${{ matrix.group }}
        run: devbox run -- task acceptance GROUP="$ACCEPTANCE_GROUP" OUTPUT="$RUNNER_TEMP/acceptance"
      - name: Verify acceptance did not modify dependency locks
        run: git diff --exit-code -- devbox.json devbox.lock go.mod go.sum
      - name: Acceptance summary
        if: always()
        run: |
          out="$RUNNER_TEMP/acceptance"
          {
            echo '## Acceptance'
            jq -r '"group: \(.group), passed: \(.passed) (exit \(.exitCode))"' "$out/acceptance-result.json" 2>/dev/null || echo 'no result recorded'
            echo
            grep -hE '^(--- (PASS|FAIL)|ok|FAIL)' "$out"/targeting/targeting-live.log 2>/dev/null | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"
      # Test-owned evidence only: no kubeconfig, rendered chart manifest, or
      # node logs. The cluster and S3 test service are torn down by the task.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: acceptance-evidence-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/acceptance
            !${{ runner.temp }}/acceptance/**/kubeconfig*
            !${{ runner.temp }}/acceptance/**/*.test
            !${{ runner.temp }}/acceptance/environment/helm-manifest.yaml
            !${{ runner.temp }}/acceptance/kind-logs
          retention-days: 14
  acceptance:
    # Stable required check: success requires every matrix group to succeed.
    # No continue-on-error; fail-fast is off so all groups retain diagnostics.
    if: always()
    needs: [acceptance-scope, checks, acceptance-live]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce acceptance decision
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.acceptance-scope.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          LIVE_RESULT: ${{ needs.acceptance-live.result }}
          ACCEPTANCE_REQUIRED: ${{ needs.acceptance-scope.outputs.required }}
          ACCEPTANCE_REASON: ${{ needs.acceptance-scope.outputs.reason }}
        run: bash scripts/ci/acceptance-gate.sh | tee -a "$GITHUB_STEP_SUMMARY"
