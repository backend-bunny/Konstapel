# The example reporting provider's runtime image: the one static binary,
# non-root, with no shell, package manager or Wolfi runtime package, so
# there is no runtime package set to lock. Built by
# scripts/examples/reference-provider-image.sh; test/demo only.
contents:
  repositories:
    - "@local ./packages"
  packages:
    - konstapel-example-reporting@local

annotations:
  org.opencontainers.image.title: konstapel-example-reporting
  org.opencontainers.image.description: "Synthetic example-reporting external assessment provider (test/demo only, not supported)"
  org.opencontainers.image.licenses: Apache-2.0
  org.opencontainers.image.vendor: backend-bunny
  org.opencontainers.image.url: https://github.com/backend-bunny/Konstapel
  org.opencontainers.image.documentation: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/external-provider-chart.md

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /usr/bin/reporting-provider
archs:
  - x86_64
