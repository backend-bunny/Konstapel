# The evaluator is isolated both ways: only the host namespaces reach its
# protocol port (the worker does not: it forwards nothing), and it may open
# no connection at all, to the API server, DNS or any source included. The
# kubelet's probes come from the node, which NetworkPolicy always admits.
# Enforcement needs a CNI that implements NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "reporting.evaluator" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reporting.labels" . | nindent 4 }}
    app.kubernetes.io/component: evaluator
spec:
  podSelector:
    matchLabels:
      {{- include "reporting.selector" (dict "root" . "component" "evaluator") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.evaluator.hostNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - {port: {{ .Values.ports.protocol }}, protocol: TCP}
  egress: []
---
# Only the host namespaces reach the worker's protocol port. Its egress (the
# API server and DNS) is not restricted here: the API server's address is
# cluster-specific.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "reporting.worker" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reporting.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      {{- include "reporting.selector" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if .Values.worker.hostNamespaces }}
    - from:
        {{- range .Values.worker.hostNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - {port: {{ .Values.ports.protocol }}, protocol: TCP}
    {{- end }}
