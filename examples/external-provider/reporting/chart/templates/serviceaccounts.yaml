{{- include "reporting.validate" . -}}
# Two identities. The worker's token is mounted because it reads the
# source; the evaluator's never is, and it is bound to no role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reporting.worker" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reporting.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reporting.evaluator" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reporting.labels" . | nindent 4 }}
    app.kubernetes.io/component: evaluator
automountServiceAccountToken: false
