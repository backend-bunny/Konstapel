---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.23.0
  labels:
    app.kubernetes.io/name: konstapel-crds
    app.kubernetes.io/part-of: konstapel
  name: assessmentrequests.compliance.erenius.io
spec:
  group: compliance.erenius.io
  names:
    kind: AssessmentRequest
    listKind: AssessmentRequestList
    plural: assessmentrequests
    shortNames:
    - areq
    singular: assessmentrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.bindingRef.name
      name: Binding
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.summary.evidence.completeness
      name: Evidence
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AssessmentRequest is an application team's on-demand assessment of its
          namespace against a ComplianceBinding.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AssessmentRequestSpec asks for an assessment of the request's own namespace
              against a binding. The namespace is the request's maximum scope; the request
              cannot change binding settings, enforcement, eligibility, or cadence.
            properties:
              bindingRef:
                description: bindingRef names the ComplianceBinding to assess this
                  namespace against.
                properties:
                  name:
                    description: name of the ComplianceBinding.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              requester:
                description: |-
                  requester is the authenticated identity that created the request. The
                  konstapel-assessment-requester admission policy sets it from the API
                  server's user info on create; user-supplied values are overwritten and
                  mismatches are rejected.
                properties:
                  uid:
                    maxLength: 128
                    type: string
                  username:
                    maxLength: 512
                    minLength: 1
                    type: string
                required:
                - username
                type: object
            required:
            - bindingRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; create a new AssessmentRequest
              rule: self == oldSelf
          status:
            description: |-
              AssessmentRequestStatus is controller-owned and team-visible. It holds a
              sanitized summary and an opaque artifact reference only: no full-binding
              inventory, storage location, credential, or reusable download token.
            properties:
              artifactRef:
                description: |-
                  artifactRef is an opaque handle to the committed package. It is not a
                  download capability; downloads authorize against this request.
                maxLength: 64
                type: string
              binding:
                description: binding is the binding identity resolved for this request.
                properties:
                  name:
                    maxLength: 253
                    type: string
                  uid:
                    maxLength: 128
                    type: string
                required:
                - name
                - uid
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              namespaceUID:
                description: |-
                  namespaceUID is the request namespace's UID at resolution. Downloads
                  are bound to it, so a recreated namespace cannot read prior evidence.
                maxLength: 128
                type: string
              phase:
                description: RequestPhase is an AssessmentRequest's lifecycle.
                enum:
                - Pending
                - Running
                - Completed
                - Failed
                - Rejected
                type: string
              run:
                description: run identifies the internal scoped run executing this
                  request.
                properties:
                  name:
                    maxLength: 253
                    type: string
                  uid:
                    maxLength: 128
                    type: string
                required:
                - name
                - uid
                type: object
              summary:
                description: |-
                  AssessmentSummary is the sanitized result summary exposed in status. It
                  contains no inventory, storage location, credential, or sibling data.
                properties:
                  evidence:
                    description: EvidenceSummary counts expected checks by evidence
                      state.
                    properties:
                      attributable:
                        format: int32
                        minimum: 0
                        type: integer
                      completeness:
                        description: EvidenceCompleteness describes evidence coverage
                          only, never outcomes.
                        enum:
                        - Complete
                        - Incomplete
                        - NoTargets
                        type: string
                      expected:
                        format: int32
                        minimum: 0
                        type: integer
                      missing:
                        format: int32
                        minimum: 0
                        type: integer
                      rejected:
                        format: int32
                        minimum: 0
                        type: integer
                      staleScopes:
                        description: |-
                          staleScopes counts bindings or policies whose configuration did not
                          resolve; any stale scope makes evidence Incomplete.
                        format: int32
                        minimum: 0
                        type: integer
                      unresolved:
                        format: int32
                        minimum: 0
                        type: integer
                    required:
                    - attributable
                    - completeness
                    - expected
                    - missing
                    - rejected
                    - unresolved
                    type: object
                  export:
                    description: ExportState records whether a run produced assessment
                      OSCAL.
                    enum:
                    - Assessment
                    - Diagnostic
                    - CaptureLost
                    type: string
                  oldestEvaluation:
                    description: |-
                      oldestEvaluation is the source evaluation time of the oldest
                      attributable observation: when the engine evaluated it, never a
                      collection, upload or report-update time. Absent when no observation
                      is attributable, and on summaries recorded before this field existed.
                    format: date-time
                    type: string
                  outcomes:
                    description: |-
                      OutcomeCounts preserves check dispositions separately from completeness.
                      It deliberately has no aggregate pass field.
                    properties:
                      acceptedRisk:
                        format: int32
                        minimum: 0
                        type: integer
                      error:
                        format: int32
                        minimum: 0
                        type: integer
                      fail:
                        format: int32
                        minimum: 0
                        type: integer
                      notApplicable:
                        format: int32
                        minimum: 0
                        type: integer
                      pass:
                        format: int32
                        minimum: 0
                        type: integer
                      skip:
                        format: int32
                        minimum: 0
                        type: integer
                      unknown:
                        format: int32
                        minimum: 0
                        type: integer
                    required:
                    - acceptedRisk
                    - error
                    - fail
                    - notApplicable
                    - pass
                    - skip
                    - unknown
                    type: object
                required:
                - evidence
                - export
                - outcomes
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
