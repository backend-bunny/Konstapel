---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.23.0
  labels:
    app.kubernetes.io/name: konstapel-crds
    app.kubernetes.io/part-of: konstapel
  name: evidencedestinations.compliance.erenius.io
spec:
  group: compliance.erenius.io
  names:
    kind: EvidenceDestination
    listKind: EvidenceDestinationList
    plural: evidencedestinations
    shortNames:
    - evdest
    singular: evidencedestination
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.s3.bucket
      name: Bucket
      type: string
    - jsonPath: .spec.s3.prefix
      name: Prefix
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.signing.mode
      name: Signing
      priority: 1
      type: string
    - jsonPath: .spec.deletionPolicy
      name: Deletion
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EvidenceDestination is a cluster-scoped, platform-managed evidence storage
          location. Runs pin it by name and UID when they start; later edits to the
          default or a binding's selection affect only subsequent runs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EvidenceDestinationSpec is platform-managed storage for evidence
              packages.
            properties:
              deletionPolicy:
                default: Retire
                description: |-
                  deletionPolicy is what deleting this destination does. Retire (the
                  default) keeps it until its outstanding obligations finish; Orphan is
                  the explicit, audited handoff. Setting it alone deletes nothing.
                enum:
                - Retire
                - Orphan
                type: string
              legacy:
                description: |-
                  legacy declares that this destination continues a legacy
                  file-configured destination (the removed --evidence-destination file).
                  Runs published there before destinations existed are attached to this
                  destination only after their recorded location is verified against
                  it and against the preserved legacy configuration. It is set only when
                  the destination is created and never changes.
                properties:
                  configuration:
                    description: |-
                      configuration is a ConfigMap in the controller namespace holding the
                      preserved legacy destination file under key. Fields that receipts do
                      not record (the region) are verified against it; nothing is taken
                      from current defaults.
                    properties:
                      key:
                        default: destination.yaml
                        description: key is the ConfigMap data key holding the destination
                          YAML.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: name of the object in the controller namespace.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                        type: string
                      namespace:
                        description: |-
                          namespace is rejected when set; it exists so that a cross-namespace
                          reference is an explicit API error rather than a silently dropped field.
                        type: string
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: references resolve in the controller namespace only;
                        namespace must not be set
                      rule: '!has(self.__namespace__)'
                  destinationID:
                    description: |-
                      destinationID is the legacy destination's id, as recorded in the
                      receipts of runs it published.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - configuration
                - destinationID
                type: object
              orphan:
                description: |-
                  orphan is required with deletionPolicy Orphan. Selecting Orphan
                  changes nothing until the destination is deleted; once that handoff is
                  accepted (status.orphanIntent) it cannot be changed or reversed.
                properties:
                  actor:
                    description: |-
                      actor is the authenticated user who set or changed the request,
                      written by the konstapel-destination-orphan admission policy.
                    maxLength: 512
                    type: string
                  actorUID:
                    description: actorUID is that user's UID when the authenticator
                      provides one.
                    maxLength: 128
                    type: string
                  reason:
                    description: reason explains the handoff. It must not be blank.
                    maxLength: 1024
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: reason must not be blank
                      rule: self.trim().size() > 0
                required:
                - reason
                type: object
              s3:
                description: s3 is the S3-compatible location and its access.
                properties:
                  addressing:
                    default: path
                    description: addressing selects path-style or virtual-hosted requests.
                    enum:
                    - path
                    - virtual
                    type: string
                  bucket:
                    description: |-
                      bucket must already exist; Konstapel never creates or reconfigures it.
                      Immutable.
                    maxLength: 63
                    minLength: 3
                    pattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$
                    type: string
                  caTrust:
                    description: |-
                      caTrust names extra trusted PEM roots in the controller namespace.
                      TLS verification is never disabled. Rotatable.
                    properties:
                      key:
                        default: ca.crt
                        description: key is the ConfigMap data key holding PEM certificates.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: name of the object in the controller namespace.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                        type: string
                      namespace:
                        description: |-
                          namespace is rejected when set; it exists so that a cross-namespace
                          reference is an explicit API error rather than a silently dropped field.
                        type: string
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: references resolve in the controller namespace only;
                        namespace must not be set
                      rule: '!has(self.__namespace__)'
                  credentialSecret:
                    description: |-
                      credentialSecret names the credential Secret in the controller
                      namespace. Rotatable, including while the destination is retiring.
                    properties:
                      accessKeyIDKey:
                        default: accessKeyID
                        description: accessKeyIDKey is the Secret data key of the
                          access key ID.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: name of the object in the controller namespace.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                        type: string
                      namespace:
                        description: |-
                          namespace is rejected when set; it exists so that a cross-namespace
                          reference is an explicit API error rather than a silently dropped field.
                        type: string
                      secretAccessKeyKey:
                        default: secretAccessKey
                        description: secretAccessKeyKey is the Secret data key of
                          the secret access key.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: references resolve in the controller namespace only;
                        namespace must not be set
                      rule: '!has(self.__namespace__)'
                  developmentFixture:
                    description: |-
                      developmentFixture permits a plain-http endpoint for an explicitly
                      isolated local test service.
                    type: boolean
                  endpoint:
                    description: endpoint is the S3 service URL. Immutable.
                    maxLength: 2048
                    minLength: 8
                    pattern: ^https?://[^\s/?#@]+(:[0-9]+)?/?$
                    type: string
                  prefix:
                    description: |-
                      prefix is a clean relative key prefix; Konstapel writes only below it.
                      Immutable.
                    maxLength: 512
                    pattern: ^[A-Za-z0-9!_.*'()-]+(/[A-Za-z0-9!_.*'()-]+)*$
                    type: string
                    x-kubernetes-validations:
                    - message: prefix must not contain . or .. segments
                      rule: '!self.matches(''(^|/)[.]{1,2}(/|$)'')'
                  region:
                    description: region of the bucket. Immutable.
                    maxLength: 64
                    minLength: 1
                    pattern: ^[a-z0-9-]+$
                    type: string
                  workloadIdentity:
                    description: workloadIdentity uses the SDK's standard credential
                      chain.
                    type: boolean
                required:
                - bucket
                - endpoint
                - region
                type: object
                x-kubernetes-validations:
                - message: endpoint, bucket, region, and prefix are immutable; create
                    a new EvidenceDestination for a new location
                  rule: self.endpoint == oldSelf.endpoint && self.bucket == oldSelf.bucket
                    && self.region == oldSelf.region && has(self.prefix) == has(oldSelf.prefix)
                    && (!has(self.prefix) || self.prefix == oldSelf.prefix)
                - message: 'set exactly one credential source: workloadIdentity or
                    credentialSecret'
                  rule: (has(self.workloadIdentity) && self.workloadIdentity) != has(self.credentialSecret)
                - message: endpoint must be https; plain http is allowed only for
                    an isolated developmentFixture
                  rule: self.endpoint.startsWith('https://') || (has(self.developmentFixture)
                    && self.developmentFixture && self.endpoint.startsWith('http://'))
              signing:
                description: |-
                  signing governs signatures of evidence published to this destination.
                  Absent means Disabled. Bindings and requests inherit it and cannot
                  override it. It can change at any time; a change applies to
                  publication intents prepared afterwards.
                properties:
                  keyless:
                    description: |-
                      keyless is rejected when set: keyless (Fulcio) signing is not
                      supported. It exists for the same reason as kms.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  kms:
                    description: |-
                      kms is rejected when set: remote signing keys are not supported yet.
                      It exists so that the request is an explicit API error rather than a
                      silently dropped field.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  mode:
                    default: Disabled
                    description: mode is Disabled (the default) or Required.
                    enum:
                    - Disabled
                    - Required
                    type: string
                  secretRef:
                    description: |-
                      secretRef names the signing key Secret in the controller namespace.
                      Required only with mode Required. Rotate by referencing a new Secret.
                    properties:
                      name:
                        description: name of the object in the controller namespace.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                        type: string
                      namespace:
                        description: |-
                          namespace is rejected when set; it exists so that a cross-namespace
                          reference is an explicit API error rather than a silently dropped field.
                        type: string
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: references resolve in the controller namespace only;
                        namespace must not be set
                      rule: '!has(self.__namespace__)'
                type: object
                x-kubernetes-validations:
                - message: signing mode Required needs secretRef naming the signing
                    key Secret in the controller namespace
                  rule: self.mode != 'Required' || has(self.secretRef)
                - message: secretRef is set only with signing mode Required
                  rule: self.mode == 'Required' || !has(self.secretRef)
                - message: KMS signing keys are not supported; use secretRef
                  rule: '!has(self.kms)'
                - message: keyless signing is not supported; use secretRef
                  rule: '!has(self.keyless)'
            required:
            - s3
            type: object
            x-kubernetes-validations:
            - message: deletionPolicy Orphan requires orphan.reason
              rule: self.deletionPolicy != 'Orphan' || has(self.orphan)
            - message: orphan is set only with deletionPolicy Orphan
              rule: '!has(self.orphan) || self.deletionPolicy == ''Orphan'''
            - message: legacy is set only when the destination is created and is immutable
              rule: has(self.legacy) == has(oldSelf.legacy) && (!has(self.legacy)
                || self.legacy == oldSelf.legacy)
          status:
            description: EvidenceDestinationStatus is written by the controller only.
            properties:
              cleanupBlockers:
                description: cleanupBlockers are bounded descriptions of what blocks
                  retirement.
                items:
                  maxLength: 512
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: conditions report readiness, signing readiness, and retirement.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              latestRetainedExpiry:
                description: latestRetainedExpiry is the latest known expiry of a
                  retained package.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  describes.
                format: int64
                type: integer
              orphanHandoff:
                description: orphanHandoff reports the work fence after an accepted
                  handoff.
                properties:
                  drained:
                    description: |-
                      drained is true when no local operation was still in flight after the
                      bounded wait.
                    type: boolean
                  fencedAt:
                    description: fencedAt is when the controller stopped issuing storage
                      operations.
                    format: date-time
                    type: string
                  inventory:
                    description: inventory is the durable ownership inventory, once
                      fully saved.
                    properties:
                      chunks:
                        description: chunks is the number of run-list ConfigMaps.
                        format: int32
                        minimum: 0
                        type: integer
                      header:
                        description: |-
                          header is the ConfigMap holding the handoff identity and chunk digests;
                          it is written last, so its presence means the inventory is complete.
                        maxLength: 253
                        type: string
                      runs:
                        description: runs is the number of runs recorded.
                        format: int32
                        minimum: 0
                        type: integer
                      savedAt:
                        description: savedAt is when the header was saved.
                        format: date-time
                        type: string
                    required:
                    - chunks
                    - header
                    - runs
                    - savedAt
                    type: object
                  uncertainOperations:
                    description: |-
                      uncertainOperations are local operations still in flight when the
                      wait ended; their remote outcome is unknown.
                    items:
                      maxLength: 256
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - drained
                - fencedAt
                type: object
              orphanIntent:
                description: orphanIntent is the accepted, irreversible orphan handoff.
                properties:
                  acceptedAt:
                    description: acceptedAt is when the controller accepted the handoff.
                    format: date-time
                    type: string
                  actor:
                    maxLength: 512
                    type: string
                  actorUID:
                    maxLength: 128
                    type: string
                  reason:
                    description: reason, actor, and actorUID are copied from the accepted
                      spec.orphan.
                    maxLength: 1024
                    type: string
                required:
                - acceptedAt
                - actor
                - reason
                type: object
              outstandingPackages:
                description: outstandingPackages counts retained packages not yet
                  deleted.
                format: int32
                minimum: 0
                type: integer
              outstandingRuns:
                description: |-
                  outstandingRuns counts accepted runs pinned to this destination that
                  have not finished publication.
                format: int32
                minimum: 0
                type: integer
              pendingSigningKeys:
                description: |-
                  pendingSigningKeys lists the signing keys that runs still waiting to
                  be signed depend on: each run's frozen intent names its key Secret and,
                  once pinned, its key. Keep these Secrets until the list no longer names
                  them; removing one leaves those runs to fail with SigningFailed.
                  Independent of spec.signing: a run prepared under Required keeps its
                  dependency after the policy changes.
                items:
                  description: |-
                    PendingSigningKey is one key Secret that unsigned, still-publishing runs
                    depend on.
                  properties:
                    keyFingerprint:
                      description: |-
                        keyFingerprint is the pinned key, when the intent pinned one; a
                        replacement key under the same name cannot satisfy those runs.
                      maxLength: 71
                      type: string
                    runs:
                      description: runs counts the runs waiting on this key.
                      format: int32
                      minimum: 1
                      type: integer
                    secretName:
                      description: secretName is the key Secret in the controller
                        namespace.
                      maxLength: 253
                      type: string
                  required:
                  - runs
                  - secretName
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-type: atomic
              signing:
                description: |-
                  signing is the observed signing policy and key identity; absent when
                  spec.signing is absent.
                properties:
                  algorithm:
                    description: algorithm of the loaded key (ecdsa-sha2-256-nistp256).
                    maxLength: 64
                    type: string
                  keyFingerprint:
                    description: |-
                      keyFingerprint identifies the loaded public key: "sha256:" and the hex
                      SHA-256 of its DER SubjectPublicKeyInfo. Set only while the key loads.
                    maxLength: 71
                    type: string
                  mode:
                    description: mode is the observed spec.signing.mode.
                    enum:
                    - Disabled
                    - Required
                    type: string
                  secretName:
                    description: secretName is the referenced Secret (Required only).
                    maxLength: 253
                    type: string
                required:
                - mode
                type: object
              unknownExpiryRuns:
                description: |-
                  unknownExpiryRuns counts outstanding runs whose expiry is not yet
                  known because they have not committed. It is not zero outstanding work.
                format: int32
                minimum: 0
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
