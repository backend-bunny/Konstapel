# Generated by scripts/charts/runtime.sh from config/admission/assessment-requester.yaml; do not edit.
# Records the authenticated creator of every AssessmentRequest. The mutation
# overwrites any user-supplied requester; the validation fails closed if the
# stored requester does not match the API server's user info.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: konstapel-assessment-requester
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [compliance.erenius.io]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [assessmentrequests]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{requester: Object.spec.requester{
            username: request.userInfo.username,
            ?uid: request.userInfo.?uid
          }}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: konstapel-assessment-requester
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  policyName: konstapel-assessment-requester
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: konstapel-assessment-requester
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [compliance.erenius.io]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [assessmentrequests]
  validations:
    - expression: >-
        has(object.spec.requester) &&
        object.spec.requester.username == request.userInfo.username &&
        object.spec.requester.?uid.orValue('') == request.userInfo.?uid.orValue('')
      message: spec.requester must be the authenticated creator
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: konstapel-assessment-requester
  labels:
    app.kubernetes.io/part-of: konstapel
spec:
  policyName: konstapel-assessment-requester
  validationActions: [Deny]
