{{- include "konstapel.validate" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: konstapel-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "konstapel.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: konstapel-controller
  labels:
    {{- include "konstapel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: konstapel-controller
subjects:
  - kind: ServiceAccount
    name: konstapel-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: konstapel-controller-assessments
  labels:
    {{- include "konstapel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: konstapel-controller-assessments
subjects:
  - kind: ServiceAccount
    name: konstapel-controller
    namespace: {{ .Release.Namespace }}
{{- if .Values.exceptions.revocationProcessing.enabled }}
---
# The gated revocation grant (generated-controller-exception-revocation.yaml),
# bound only with --exception-revocation-processing below and the exception
# webhooks (validateExceptions refuses it without them). docs/charts.md,
# "Exception admission webhooks", gives the enable and disable order.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: konstapel-controller-exception-revocation
  labels:
    {{- include "konstapel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: konstapel-controller-exception-revocation
subjects:
  - kind: ServiceAccount
    name: konstapel-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: konstapel-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "konstapel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: konstapel-controller
subjects:
  - kind: ServiceAccount
    name: konstapel-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: konstapel-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "konstapel.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "konstapel.controllerSelector" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "konstapel.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: konstapel-controller
      terminationGracePeriodSeconds: {{ .Values.controller.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "konstapel.controllerSelector" . | nindent 20 }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - controller
            - --leader-elect=true
            - --health-probe-bind-address=:8081
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:8443
            - --metrics-cert-dir=/etc/konstapel/metrics-tls
            - --metrics-server-name=konstapel-controller-metrics.{{ .Release.Namespace }}.svc
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            - --evidence-staging-dir=/var/lib/konstapel/staging
            - --shutdown-timeout={{ .Values.controller.shutdownTimeoutSeconds }}s
            {{- with .Values.controller.collection }}
            - --collection-page-size={{ int64 .pageSize }}
            - --collection-max-requests={{ int64 .maxRequests }}
            - --collection-max-objects={{ int64 .maxObjects }}
            - --collection-max-bytes={{ int64 .maxBytes }}
            {{- end }}
            # Platform packages carry supporting evidence only while every
            # download replica runs this controller's image (it enforces the
            # document-read check); without the download service none serves.
            {{- if .Values.download.enabled }}
            - --protected-package-readers=konstapel-download
            {{- else }}
            - --protected-package-readers=none
            {{- end }}
            {{- if .Values.exceptions.webhooks.enabled }}
            # Every replica serves the ComplianceException webhooks.
            - --webhook-cert-dir=/etc/konstapel/webhook-tls
            - --webhook-port=9443
            {{- if .Values.exceptions.revocationProcessing.enabled }}
            - --exception-revocation-processing
            {{- end }}
            {{- end }}
            {{- if include "konstapel.bundlesEnabled" . }}
            - --bundle-sources-configmap={{ .Values.bundles.sourcesConfigMap }}
            - --bundle-cache-dir=/var/lib/konstapel/bundles
            - --bundle-cache-capacity={{ .Values.bundles.cache.capacity }}
            - --bundle-refresh-interval={{ .Values.bundles.refreshInterval }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: probes
              containerPort: 8081
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 8443
            {{- end }}
            {{- if .Values.exceptions.webhooks.enabled }}
            - name: webhook
              containerPort: 9443
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: probes
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: staging
              mountPath: /var/lib/konstapel/staging
            - name: tmp
              mountPath: /tmp
            {{- if include "konstapel.bundlesEnabled" . }}
            - name: bundle-cache
              mountPath: /var/lib/konstapel/bundles
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics-tls
              mountPath: /etc/konstapel/metrics-tls
              readOnly: true
            {{- end }}
            {{- if .Values.exceptions.webhooks.enabled }}
            - name: webhook-tls
              mountPath: /etc/konstapel/webhook-tls
              readOnly: true
            {{- end }}
      volumes:
        # Per-pod bounded working storage. Durable state lives in Kubernetes
        # and the evidence destination; a successor recovers from those.
        - name: staging
          emptyDir:
            sizeLimit: {{ .Values.controller.stagingSizeLimit }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if include "konstapel.bundlesEnabled" . }}
        # Per-pod OCI bundle content cache (--bundle-cache-dir), owned by this
        # replica's process only. Content is re-verified on use after a
        # restart; acceptances and pins are recomputed from cluster state.
        - name: bundle-cache
          emptyDir:
            sizeLimit: {{ .Values.bundles.cache.sizeLimit }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        # The metrics certificate, verified at start and re-read while
        # serving; a rotation that fails verification keeps the last one.
        - name: metrics-tls
          secret:
            secretName: {{ include "konstapel.metricsTLSSecret" . }}
        {{- end }}
        {{- if .Values.exceptions.webhooks.enabled }}
        # The webhook certificate, verified at start and re-read while
        # serving; readiness fails while it is invalid or expired, so the
        # replica leaves konstapel-webhook.
        - name: webhook-tls
          secret:
            secretName: {{ include "konstapel.webhookTLSSecret" . }}
        {{- end }}
{{- if and (gt (int .Values.replicaCount) 1) .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: konstapel-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "konstapel.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "konstapel.controllerSelector" . | nindent 6 }}
{{- end }}
