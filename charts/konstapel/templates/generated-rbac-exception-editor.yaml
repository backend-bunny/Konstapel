# Generated by scripts/charts/runtime.sh from config/rbac/exception-editor.yaml; do not edit.
# Application teams accept, renew and withdraw self-service exceptions for
# workloads in their own namespace.
# Bind with a RoleBinding in the team's namespace, never a ClusterRoleBinding:
# a RoleBinding confines every exception, and so its workload scope, to that
# namespace. Status and the acceptance snapshots are written only by the
# Konstapel controller; the protected acceptance record is maintained by
# admission (config/webhook/exceptions.yaml). Deliberately not aggregated into the
# built-in admin/edit roles: holding namespace edit rights does not by itself
# confer authority to accept risk.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: konstapel-exception-editor
  labels:
    app.kubernetes.io/part-of: konstapel
rules:
  - apiGroups: [compliance.erenius.io]
    resources: [complianceexceptions]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [compliance.erenius.io]
    resources: [complianceexceptions/status]
    verbs: [get]
