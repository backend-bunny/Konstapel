# Generated by scripts/charts/runtime.sh from config/rbac/assessment-requester.yaml; do not edit.
# Application teams request assessments of their own namespace. Bind with a
# RoleBinding in the team's namespace, never a ClusterRoleBinding. Requests are
# immutable, so there is no update/patch. The download attribute is checked by
# the evidence download service with SubjectAccessReview; it is not a CRD
# subresource. Teams get no access to cluster-scoped AssessmentRuns.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: konstapel-assessment-requester
  labels:
    app.kubernetes.io/part-of: konstapel
rules:
  - apiGroups: [compliance.erenius.io]
    resources: [assessmentrequests]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [compliance.erenius.io]
    resources: [assessmentrequests/status, assessmentrequests/download]
    verbs: [get]
