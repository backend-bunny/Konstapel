# Runtime chart values. docs/charts.md ("Values contract") describes each
# one; values.schema.json rejects anything else. Every setting traces to a
# merged owner (docs/charts.md, "Chart input contract").

image:
  repository: ghcr.io/backend-bunny/konstapel
  # digest pins the controller image. Release packaging injects the verified
  # published digest into an isolated chart copy; source never carries one.
  digest: ""
  pullPolicy: IfNotPresent

# replicaCount defaults to two replicas (add-controller-high-availability): one
# elected leader runs the controllers, the other takes over. Development values
# may set 1, which omits the default PodDisruptionBudget. Election stays on.
replicaCount: 2

# Rendered only when replicaCount > 1; minAvailable must stay below
# replicaCount so voluntary evictions can proceed one at a time.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

controller:
  # Overall shutdown budget (--shutdown-timeout); must be below the grace
  # period so Kubernetes never kills a pod that is still draining.
  shutdownTimeoutSeconds: 45
  terminationGracePeriodSeconds: 60
  # Per-pod working storage for frozen captures and packages awaiting
  # publication; two replicas use twice this at most.
  stagingSizeLimit: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  # Evidence collection limits (docs/assessment-providers.md, "Collection
  # limits"), per collection of one binding. A collection that meets one
  # uses none of its evidence and is Incomplete. The defaults are the
  # controller's; the deadline is each binding's collectionTimeout. Decoded
  # objects take about 2.4 times maxBytes in memory: raise
  # controller.resources.limits.memory together with maxBytes or maxObjects.
  collection:
    # --collection-page-size: objects per list request, 1 to 10000 and at
    # most maxObjects.
    pageSize: 500
    # --collection-max-requests: list requests, 1 to 1000000 and at least
    # the pages maxObjects takes (maxObjects / pageSize, rounded up).
    maxRequests: 20000
    # --collection-max-objects: objects read, 1 to 10000000.
    maxObjects: 100000
    # --collection-max-bytes: bytes of object JSON read, 1572864 (1.5 MiB)
    # to 68719476736 (64 GiB), and at least pageSize x 4096.
    maxBytes: 536870912
  # Empty uses preferred hostname anti-affinity (weight 100). Setting it
  # replaces that default entirely.
  affinity: {}
  nodeSelector: {}
  tolerations: []

# Verified OCI policy bundles (docs/policy-bundles.md, "Controller wiring").
# Off by default: with sourcesConfigMap empty the chart renders exactly what
# it renders without this section, and the controller serves only the
# vendored bundle.
bundles:
  # Name of the central sources ConfigMap (data key sources.yaml) in the
  # release namespace. Setting it enables OCI bundle content. You create and
  # maintain that ConfigMap; the chart never renders or changes it.
  sourcesConfigMap: ""
  cache:
    # --bundle-cache-capacity: what the content cache may hold, including
    # staging and retained verification evidence. It must hold one maximal
    # entry (about 372Mi with the default limits).
    capacity: 1Gi
    # Per-pod emptyDir for the cache; must be larger than capacity. Each
    # replica keeps its own cache, rebuilt from the registry (or retained
    # evidence) after a restart.
    sizeLimit: 1536Mi
  # --bundle-refresh-interval: how often referenced Secrets and ConfigMaps
  # are re-read by name (at most 5m). A rotation or revocation of one is
  # noticed within this interval.
  refreshInterval: 30s
  # Every object sources.yaml references, in the release namespace: each
  # credentialSecret and Secret-held ca, publicKey or trustRoot, and each
  # ConfigMap-held ca, publicKey or trustRoot. The bundle Role grants get on
  # exactly these names (docs/charts.md, "OCI policy bundles", explains how
  # this relates to the controller's broader generated Role).
  referencedSecrets: []
  referencedConfigMaps: []

# The controller's client for registered external assessment providers
# (AssessmentProvider; docs/charts.md, "External assessment providers").
# Off by default: the controller then watches, contacts and selects no
# external provider, and the chart renders exactly what it renders without
# this section. The chart installs no provider, binds neither
# konstapel-assessment-provider-* role and grants the controller nothing
# new: providers run under their own ServiceAccounts and permissions.
externalProviders:
  # Mounts clientCertSecretName read-only and passes
  # --external-provider-client-cert-dir. A missing, invalid or expired
  # certificate then fails controller startup.
  enabled: false
  # With enabled only: a kubernetes.io/tls Secret in the release namespace
  # (tls.crt, tls.key), such as one cert-manager issues, whose certificate
  # allows client authentication and names, as a DNS SAN, the identity your
  # providers authorize. You create and rotate it; the chart never renders
  # it. A rotation is used from the next probe, without a restart.
  clientCertSecretName: ""

tls:
  # mode selects who issues the service certificates, exclusively:
  #   certManager (default): a separately installed cert-manager. Optionally
  #     set certManager.issuerRef {name, kind: Issuer|ClusterIssuer} to use a
  #     platform issuer instead of a chart-managed self-signed CA.
  #   secret: operator-managed; set secret.name to a kubernetes.io/tls Secret
  #     with tls.crt, tls.key and ca.crt in the release namespace.
  mode: certManager

# The evidence download server (`konstapel download-server`): every ready
# replica serves through the konstapel-download Service, authenticating and
# authorizing each request and fetching the package from its destination.
# Its TLS certificate comes from tls (above).
download:
  enabled: true
  replicaCount: 2
  audience: konstapel-download
  maxConcurrent: 4
  # Bytes buffered for verification across concurrent downloads, per pod.
  maxTempBytes: 2147483648
  tempSizeLimit: 3Gi
  shutdownDrainSeconds: 20
  # Supporting-evidence transfers (docs/supporting-evidence.md, "Uploading
  # and downloading"); the server refuses to start with invalid values.
  attachments:
    # --attachment-max-bytes: the largest registered document accepted for
    # upload, 1 byte to 1 GiB and at most maxTempBytes. Staged uploads share
    # the temporary storage with package downloads.
    maxBytes: 33554432
    # --attachment-timeout: one transfer's deadline, receiving and storing
    # included; 1s to 1h, in whole seconds or minutes.
    timeout: 5m
    # --attachment-max-concurrent: uploads and downloads together per
    # replica, 1 to 64.
    maxConcurrent: 2
    # --attachment-retention: central source retention frozen into each new
    # commitment, expiresAt = max(committedAt, validUntil) + retention.
    # Whole seconds, minutes or hours. Changing it never shortens an
    # existing commitment.
    retention: 2160h
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}

# ComplianceException admission webhooks and revocation processing
# (add-self-service-policy-exceptions; docs/charts.md, "Exception admission
# webhooks"). Both are off by default; neither enables native Kyverno
# exception grants, which keep their own upstream capability gate.
exceptions:
  # The two konstapel-exception-acceptance webhooks (failurePolicy Fail), the
  # konstapel-webhook Service and every controller replica serving them
  # (--webhook-cert-dir). While enabled, no ComplianceException can be
  # created or updated unless a ready replica admits it. The certificate
  # comes from tls.mode: cert-manager issues konstapel-webhook-tls and
  # injects its CA, or with tls.mode=secret set tls below.
  webhooks:
    enabled: false
    tls:
      # With tls.mode=secret only: a kubernetes.io/tls Secret in the release
      # namespace with tls.crt, tls.key and ca.crt covering
      # konstapel-webhook.<namespace>.svc, and the PEM CA bundle the API
      # server uses to verify it (written to both webhooks' caBundle).
      secretName: ""
      caBundle: ""
  # Revocation records and the revocation finalizer's release: the gated
  # ClusterRole konstapel-controller-exception-revocation, its binding and
  # --exception-revocation-processing, together. Needs webhooks.enabled
  # (the render fails otherwise): only those webhooks confine the grant's
  # complianceexceptions update/patch to releasing the finalizer. Enable the
  # webhooks in one upgrade and this in the next; disable in reverse. Off:
  # revoked exceptions keep their finalizer and report
  # RevocationProcessingDisabled.
  revocationProcessing:
    enabled: false

# Authenticated controller metrics (docs/charts.md, "Controller metrics"), off
# by default. Every controller replica serves HTTPS on the
# konstapel-controller-metrics Service (port 443, name https). Each scrape is
# authenticated with a TokenReview and authorized with a SubjectAccessReview
# for get on the non-resource URL /metrics; enabling this lets the controller
# ServiceAccount create both reviews cluster-wide. The certificate comes from
# tls.mode: cert-manager issues konstapel-controller-metrics-tls, or with
# tls.mode=secret set tls.secretName below.
metrics:
  enabled: false
  # Monitoring ServiceAccounts allowed to scrape, bound to the
  # konstapel-metrics-reader ClusterRole: [{namespace: monitoring, name: prometheus}].
  # Leave empty to bind the role yourself.
  readers: []
  tls:
    # With tls.mode=secret: a kubernetes.io/tls Secret in the release
    # namespace with tls.crt, tls.key and ca.crt covering
    # konstapel-controller-metrics.<namespace>.svc.
    secretName: ""
  # Optional Prometheus Operator integrations (docs/charts.md, "Monitoring
  # integration"). Each needs metrics.enabled and, when enabled, its own
  # monitoring.coreos.com/v1 API (helm template: --api-versions
  # monitoring.coreos.com/v1/ServiceMonitor, .../PrometheusRule). Neither
  # chart installs Prometheus, the Operator or their CRDs.
  serviceMonitor:
    enabled: false
    # Labels your Prometheus's serviceMonitorSelector requires, for example
    # {release: kube-prometheus-stack}. The Prometheus's
    # serviceMonitorNamespaceSelector must also admit the release namespace.
    labels: {}
    # Scrape timing; the timeout must be shorter than the interval, and the
    # interval at most 2m so the starter alerts' 5m windows hold.
    interval: 30s
    scrapeTimeout: 10s
    # Name verified against the serving certificate; default is the metrics
    # Service name, namespace and .svc.
    serverName: ""
    tls:
      # Where the CA that verifies the metrics certificate comes from: the
      # Secret of the active TLS mode (ca.crt), or one you name here. Set one
      # of secret, configMap or file.
      ca:
        secret: {name: "", key: ca.crt}
        configMap: {name: "", key: ca.crt}
        file: ""
    # How Prometheus presents a token for the reader ServiceAccount.
    #   serviceAccountToken: its own mounted token file (bearerTokenFile, the
    #     only file-based option the ServiceMonitor API offers; it needs an
    #     Operator that permits file access from ServiceMonitors).
    #   secret: a Secret in the release namespace holding a token, which the
    #     Operator reads (works where file access is denied; you create and
    #     rotate it).
    authorization:
      mode: serviceAccountToken
      secret: {name: "", key: token}
  # Rules are rendered from groups. The chart ships the seven starter alerts
  # below (docs/integration/alert-runbooks.md); add your own groups beside
  # them. A PrometheusRule renders only while some group has an enabled rule.
  #   groups:
  #     <group-name>:
  #       enabled: true
  #       interval: 1m
  #       rules:
  #         <AlertName>: {enabled: true, expr: "...__scope__...", for: 10m,
  #                       threshold: 1, window: 15m, severity: warning,
  #                       runbookURL: https://..}
  # In expr:
  #   __scope__         the scrape-scope matchers (see scope)
  #   __scope_labels__  their label names, for by (...) and on (...)
  #   __threshold__     the rule's threshold; __window__ its window
  #   __owner(<domain>)__  the one replica holding a fresh, ready projection
  #                     of that domain (targeting, assessment,
  #                     bundle_resolution, evidence_storage), or nothing when
  #                     none or several do; join gauges to it with
  #                     "and on (__scope_labels__, instance)"
  #   __owners__        the same for every domain, with its domain label
  # Maps merge across value files, so one rule can be tuned alone:
  # --set metrics.prometheusRule.groups.<g>.rules.<A>.for=15m.
  prometheusRule:
    enabled: false
    labels: {}
    # Runbook link for rules without a runbookURL: <runbookBaseURL>/<Alert>.
    # The starter alerts set their own runbookURL.
    runbookBaseURL: ""
    # Label matchers that select this release's scraped series. Empty means
    # the ServiceMonitor's target labels: job, namespace and release instance.
    # Set them for an externally configured scrape job. Exact values only.
    # Add your cluster label when one ruler evaluates several clusters.
    scope:
      matchers: {}
    # How old an owner's projection (konstapel_observation_updated_timestamp_seconds)
    # may be when rules read it: the controller's 2m maximum plus the scrape
    # interval. Older samples (a replica no longer scraped, a lingering
    # former leader) are not an owner.
    maxProjectionAge: 4m
    groups:
      # Is this release scraped, and does each enabled domain have exactly
      # one fresh owner? Operational rules are silent without one, so these
      # alerts are what reports missing observability.
      konstapel-availability:
        rules:
          KonstapelMetricsUnavailable:
            # No target, or no successful scrape on any target.
            expr: |-
              max by (__scope_labels__) (up{__scope__}) == 0
              or
              absent(up{__scope__})
            for: 5m
            runbookURL: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelmetricsunavailable
            annotations:
              summary: Konstapel controller metrics are not being scraped.
              description: >-
                Prometheus has no successful scrape of the Konstapel release
                selected by this alert's labels. No other Konstapel alert can
                fire meanwhile; this says nothing about enforcement,
                assessments or evidence.
          KonstapelObservationUnavailable:
            # Enabled, but no single replica holds a fresh, ready projection.
            expr: |-
              max by (__scope_labels__, domain) (konstapel_observation_enabled{__scope__}) == 1
              unless on (__scope_labels__, domain)
              __owners__
            for: 5m
            runbookURL: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelobservationunavailable
            annotations:
              summary: Konstapel's {{ $labels.domain }} observation is unavailable.
              description: >-
                The enabled {{ $labels.domain }} domain has no fresh, ready
                projection on exactly one replica. Its alerts cannot fire,
                and their resolution does not mean recovery.
      # Operational alerts. Each reads gauges only from the domain's single
      # fresh owner (__owner(...)__), aggregated per release with max, never
      # summed across replicas.
      konstapel-operations:
        rules:
          KonstapelBindingUnresolved:
            expr: |-
              max by (__scope_labels__, binding) (
                konstapel_binding_condition{__scope__, condition="Resolved", status!="true"} == 1
                and on (__scope_labels__, instance) __owner(targeting)__
              )
            for: 10m
            runbookURL: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelbindingunresolved
            annotations:
              summary: ComplianceBinding {{ $labels.binding }} is not resolved.
              description: >-
                The Resolved condition of ComplianceBinding {{ $labels.binding }}
                is false or unknown for its current generation. Its previous
                enforcement stays in force; changes to it are not delivered.
          KonstapelEngineUnavailable:
            expr: |-
              max by (__scope_labels__, capability) (
                konstapel_capability_condition{__scope__, status!="true"} == 1
                and on (__scope_labels__, instance) __owner(targeting)__
              )
            for: 10m
            runbookURL: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelengineunavailable
            annotations:
              summary: Kyverno capability {{ $labels.capability }} is unavailable to Konstapel.
              description: >-
                The {{ $labels.capability }} capability is false (API missing
                or access denied) or unknown (dependency cannot be asked).
          KonstapelAssessmentOverdue:
            # Seconds past the scheduled due time plus the collection
            # timeout; threshold is the grace.
            expr: |-
              time()
              - max by (__scope_labels__, binding) (konstapel_binding_scheduled_due_timestamp_seconds{__scope__} and on (__scope_labels__, instance) __owner(assessment)__)
              - max by (__scope_labels__, binding) (konstapel_binding_collection_timeout_seconds{__scope__} and on (__scope_labels__, instance) __owner(assessment)__)
              > __threshold__
            threshold: 600
            for: 5m
            runbookURL: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelassessmentoverdue
            annotations:
              summary: Scheduled assessment of {{ $labels.binding }} is overdue.
              description: >-
                ComplianceBinding {{ $labels.binding }} has scheduled work
                outstanding past its due time, collection timeout and grace.
                Namespace requests and diagnostic runs do not meet it.
          KonstapelPublicationFailing:
            # A failing run is actionable only until the 5-minute publish
            # timeout after its collection closed, so the hold stays shorter.
            expr: |-
              max by (__scope_labels__) (konstapel_publication_failed{__scope__} and on (__scope_labels__, instance) __owner(evidence_storage)__) > 0
              and on (__scope_labels__)
              sum by (__scope_labels__) (increase(konstapel_operation_attempts_total{__scope__, operation="evidence_publication", result="failure"}[__window__])) >= __threshold__
            threshold: 3
            window: 15m
            for: 2m
            runbookURL: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelpublicationfailing
            annotations:
              summary: Konstapel evidence publication is failing.
              description: >-
                Assessment runs are retrying publication after repeated failed
                attempts. Their assessment results stand; their evidence
                packages are not committed.
          KonstapelCleanupBlocked:
            # Blocked cleanup, or pending cleanup more than threshold
            # seconds past the oldest recorded expiry.
            expr: |-
              max by (__scope_labels__) (konstapel_cleanup_blocked{__scope__} and on (__scope_labels__, instance) __owner(evidence_storage)__) > 0
              or
              (
                time() - max by (__scope_labels__) (konstapel_cleanup_oldest_expiry_timestamp_seconds{__scope__} and on (__scope_labels__, instance) __owner(evidence_storage)__) > __threshold__
                and on (__scope_labels__)
                max by (__scope_labels__) (konstapel_cleanup_pending{__scope__} and on (__scope_labels__, instance) __owner(evidence_storage)__) > 0
              )
            threshold: 3600
            for: 15m
            runbookURL: https://github.com/backend-bunny/Konstapel/blob/main/docs/integration/alert-runbooks.md#konstapelcleanupblocked
            annotations:
              summary: Konstapel evidence retention cleanup is blocked or late.
              description: >-
                Expired evidence packages are retained past their expiry:
                storage refuses deletion, or deletion is unconfirmed more than
                an hour after the oldest expiry. Records outlive deleted
                bindings, so check every AssessmentRun.
