# Runtime chart values. docs/charts.md ("Values contract") describes each
# one; values.schema.json rejects anything else. Every setting traces to a
# merged owner (docs/charts.md, "Chart input contract").

image:
  repository: ghcr.io/backend-bunny/konstapel
  # digest pins the controller image. Release packaging injects the verified
  # published digest into an isolated chart copy; source never carries one.
  digest: ""
  pullPolicy: IfNotPresent

# replicaCount defaults to two replicas (add-controller-high-availability): one
# elected leader runs the controllers, the other takes over. Development values
# may set 1, which omits the default PodDisruptionBudget. Election stays on.
replicaCount: 2

# Rendered only when replicaCount > 1; minAvailable must stay below
# replicaCount so voluntary evictions can proceed one at a time.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

controller:
  # Overall shutdown budget (--shutdown-timeout); must be below the grace
  # period so Kubernetes never kills a pod that is still draining.
  shutdownTimeoutSeconds: 45
  terminationGracePeriodSeconds: 60
  # Per-pod working storage for frozen captures and packages awaiting
  # publication; two replicas use twice this at most.
  stagingSizeLimit: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  # Empty uses preferred hostname anti-affinity (weight 100). Setting it
  # replaces that default entirely.
  affinity: {}
  nodeSelector: {}
  tolerations: []

# Verified OCI policy bundles (docs/policy-bundles.md, "Controller wiring").
# Off by default: with sourcesConfigMap empty the chart renders exactly what
# it renders without this section, and the controller serves only the
# vendored bundle.
bundles:
  # Name of the central sources ConfigMap (data key sources.yaml) in the
  # release namespace. Setting it enables OCI bundle content. You create and
  # maintain that ConfigMap; the chart never renders or changes it.
  sourcesConfigMap: ""
  cache:
    # --bundle-cache-capacity: what the content cache may hold, including
    # staging and retained verification evidence. It must hold one maximal
    # entry (about 372Mi with the default limits).
    capacity: 1Gi
    # Per-pod emptyDir for the cache; must be larger than capacity. Each
    # replica keeps its own cache, rebuilt from the registry (or retained
    # evidence) after a restart.
    sizeLimit: 1536Mi
  # --bundle-refresh-interval: how often referenced Secrets and ConfigMaps
  # are re-read by name (at most 5m). A rotation or revocation of one is
  # noticed within this interval.
  refreshInterval: 30s
  # Every object sources.yaml references, in the release namespace: each
  # credentialSecret and Secret-held ca, publicKey or trustRoot, and each
  # ConfigMap-held ca, publicKey or trustRoot. The bundle Role grants get on
  # exactly these names (docs/charts.md, "OCI policy bundles", explains how
  # this relates to the controller's broader generated Role).
  referencedSecrets: []
  referencedConfigMaps: []

tls:
  # mode selects who issues the service certificates, exclusively:
  #   certManager (default): a separately installed cert-manager. Optionally
  #     set certManager.issuerRef {name, kind: Issuer|ClusterIssuer} to use a
  #     platform issuer instead of a chart-managed self-signed CA.
  #   secret: operator-managed; set secret.name to a kubernetes.io/tls Secret
  #     with tls.crt, tls.key and ca.crt in the release namespace.
  mode: certManager

# The evidence download server (`konstapel download-server`): every ready
# replica serves through the konstapel-download Service, authenticating and
# authorizing each request and fetching the package from its destination.
# Its TLS certificate comes from tls (above).
download:
  enabled: true
  replicaCount: 2
  audience: konstapel-download
  maxConcurrent: 4
  # Bytes buffered for verification across concurrent downloads, per pod.
  maxTempBytes: 2147483648
  tempSizeLimit: 3Gi
  shutdownDrainSeconds: 20
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}

# Authenticated controller metrics (docs/charts.md, "Controller metrics"), off
# by default. Every controller replica serves HTTPS on the
# konstapel-controller-metrics Service (port 443, name https). Each scrape is
# authenticated with a TokenReview and authorized with a SubjectAccessReview
# for get on the non-resource URL /metrics; enabling this lets the controller
# ServiceAccount create both reviews cluster-wide. The certificate comes from
# tls.mode: cert-manager issues konstapel-controller-metrics-tls, or with
# tls.mode=secret set tls.secretName below.
metrics:
  enabled: false
  # Monitoring ServiceAccounts allowed to scrape, bound to the
  # konstapel-metrics-reader ClusterRole: [{namespace: monitoring, name: prometheus}].
  # Leave empty to bind the role yourself.
  readers: []
  tls:
    # With tls.mode=secret: a kubernetes.io/tls Secret in the release
    # namespace with tls.crt, tls.key and ca.crt covering
    # konstapel-controller-metrics.<namespace>.svc.
    secretName: ""
  # Optional Prometheus Operator integrations (docs/charts.md, "Monitoring
  # integration"). Each needs metrics.enabled and, when enabled, its own
  # monitoring.coreos.com/v1 API (helm template: --api-versions
  # monitoring.coreos.com/v1/ServiceMonitor, .../PrometheusRule). Neither
  # chart installs Prometheus, the Operator or their CRDs.
  serviceMonitor:
    enabled: false
    # Labels your Prometheus's serviceMonitorSelector requires, for example
    # {release: kube-prometheus-stack}. The Prometheus's
    # serviceMonitorNamespaceSelector must also admit the release namespace.
    labels: {}
    # Scrape timing; the timeout must be shorter than the interval, and the
    # interval at most 2m so the starter alerts' 5m windows hold.
    interval: 30s
    scrapeTimeout: 10s
    # Name verified against the serving certificate; default is the metrics
    # Service name, namespace and .svc.
    serverName: ""
    tls:
      # Where the CA that verifies the metrics certificate comes from: the
      # Secret of the active TLS mode (ca.crt), or one you name here. Set one
      # of secret, configMap or file.
      ca:
        secret: {name: "", key: ca.crt}
        configMap: {name: "", key: ca.crt}
        file: ""
    # How Prometheus presents a token for the reader ServiceAccount.
    #   serviceAccountToken: its own mounted token file (bearerTokenFile, the
    #     only file-based option the ServiceMonitor API offers; it needs an
    #     Operator that permits file access from ServiceMonitors).
    #   secret: a Secret in the release namespace holding a token, which the
    #     Operator reads (works where file access is denied; you create and
    #     rotate it).
    authorization:
      mode: serviceAccountToken
      secret: {name: "", key: token}
  # Rules are rendered from groups; the chart ships no group of its own yet
  # (starter alerts come with add-prometheus-observability group 5), so
  # enabling this renders nothing until a group with an enabled rule exists.
  #   groups:
  #     <group-name>:
  #       enabled: true
  #       interval: 1m
  #       rules:
  #         <AlertName>: {enabled: true, expr: "...__scope__...", for: 10m,
  #                       threshold: 1, severity: warning, runbookURL: https://..}
  # In expr, __scope__ becomes the scrape-scope matchers and __threshold__ the
  # rule's threshold. Maps merge across value files, so one rule can be tuned
  # alone: --set metrics.prometheusRule.groups.<g>.rules.<A>.for=15m.
  prometheusRule:
    enabled: false
    labels: {}
    runbookBaseURL: ""
    # Label matchers that select this release's scraped series. Empty means
    # the ServiceMonitor's target labels: job, namespace and release instance.
    # Set them for an externally configured scrape job. Exact values only.
    scope:
      matchers: {}
    groups: {}
