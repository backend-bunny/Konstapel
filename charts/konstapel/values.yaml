# Runtime chart values. docs/charts.md ("Values contract") describes each
# one; values.schema.json rejects anything else. Every setting traces to a
# merged owner (docs/charts.md, "Chart input contract").

image:
  repository: ghcr.io/backend-bunny/konstapel
  # digest pins the controller image. Release packaging injects the verified
  # published digest into an isolated chart copy; source never carries one.
  digest: ""
  pullPolicy: IfNotPresent

# replicaCount defaults to two replicas (add-controller-high-availability): one
# elected leader runs the controllers, the other takes over. Development values
# may set 1, which omits the default PodDisruptionBudget. Election stays on.
replicaCount: 2

# Rendered only when replicaCount > 1; minAvailable must stay below
# replicaCount so voluntary evictions can proceed one at a time.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

controller:
  # Overall shutdown budget (--shutdown-timeout); must be below the grace
  # period so Kubernetes never kills a pod that is still draining.
  shutdownTimeoutSeconds: 45
  terminationGracePeriodSeconds: 60
  # Per-pod working storage for frozen captures and packages awaiting
  # publication; two replicas use twice this at most.
  stagingSizeLimit: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  # Empty uses preferred hostname anti-affinity (weight 100). Setting it
  # replaces that default entirely.
  affinity: {}
  nodeSelector: {}
  tolerations: []

tls:
  # mode selects who issues the service certificates, exclusively:
  #   certManager (default): a separately installed cert-manager. Optionally
  #     set certManager.issuerRef {name, kind: Issuer|ClusterIssuer} to use a
  #     platform issuer instead of a chart-managed self-signed CA.
  #   secret: operator-managed; set secret.name to a kubernetes.io/tls Secret
  #     with tls.crt, tls.key and ca.crt in the release namespace.
  mode: certManager

# The evidence download server (`konstapel download-server`): every ready
# replica serves through the konstapel-download Service, authenticating and
# authorizing each request and fetching the package from its destination.
# Its TLS certificate comes from tls (above).
download:
  enabled: true
  replicaCount: 2
  audience: konstapel-download
  maxConcurrent: 4
  # Bytes buffered for verification across concurrent downloads, per pod.
  maxTempBytes: 2147483648
  tempSizeLimit: 3Gi
  shutdownDrainSeconds: 20
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}
